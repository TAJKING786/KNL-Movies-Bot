<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Movies</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e1116;--bg2:#151a21;--card:#1a2029;--line:#242c37;--txt:#eef2f7;
--dim:#8b97a8;--accent:#2f86eb;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
overscroll-behavior:none;-webkit-font-smoothing:antialiased;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(14,17,22,.94);backdrop-filter:blur(14px);
border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 14px 12px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7c3aed);
display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.htitle{font-size:16px;font-weight:700;line-height:1.2}
.hsub{font-size:11px;color:var(--dim);margin-top:2px}
.iconbtn{margin-left:auto;width:34px;height:34px;border-radius:10px;background:var(--card);
border:1px solid var(--line);color:var(--dim);font-size:15px;display:flex;align-items:center;
justify-content:center;cursor:pointer;flex:0 0 auto}
.iconbtn:active{transform:scale(.92)}
.iconbtn.spin{animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.search{position:relative;margin-top:12px}
.search input{width:100%;padding:12px 14px 12px 38px;border-radius:12px;background:var(--card);
border:1px solid var(--line);color:var(--txt);font-size:14px;outline:none}
.search input:focus{border-color:var(--accent)}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;
background:var(--card);border:1px solid var(--line);color:var(--dim);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.wrap{padding:0 14px 20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer}
.card:active{transform:scale(.97)}
.poster{position:relative;width:100%;aspect-ratio:2/3;background:var(--bg2);overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;
background:linear-gradient(150deg,#1f2937,#111827)}
.qbadge{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:7px;background:rgba(0,0,0,.72);
backdrop-filter:blur(6px);font-size:10px;font-weight:700}
.cbody{padding:10px 11px 12px}
.cname{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;
-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.csize{font-size:11px;color:var(--dim);margin-top:5px}
.sk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sk .a{width:100%;aspect-ratio:2/3;background:linear-gradient(100deg,#1a2029 30%,#232b36 50%,#1a2029 70%);
background-size:220% 100%;animation:sh 1.3s infinite}
.sk .b{height:12px;margin:12px 11px;border-radius:6px;background:#232b36}
.sk .c{height:9px;margin:0 11px 14px;width:50%;border-radius:6px;background:#1f2731}
@keyframes sh{0%{background-position:120% 0}100%{background-position:-120% 0}}
.state{text-align:center;padding:56px 24px;color:var(--dim)}
.state .em{font-size:44px;margin-bottom:12px}
.state h3{color:var(--txt);font-size:16px;margin:0 0 6px}
.state p{font-size:13px;line-height:1.6;margin:0}
.btn{padding:11px 20px;border-radius:11px;border:none;background:var(--accent);color:#fff;
font-size:13px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--txt)}
.btn.bad{background:var(--bad)}
.btn.wide{width:100%;padding:15px;font-size:15px;border-radius:14px}
.btn[disabled]{opacity:.55;pointer-events:none}
.detail{position:fixed;inset:0;z-index:60;background:var(--bg);transform:translateY(100%);
transition:transform .26s cubic-bezier(.3,.8,.3,1);overflow-y:auto}
.detail.open{transform:translateY(0)}
.backdrop{position:absolute;top:0;left:0;right:0;height:340px;overflow:hidden}
.backdrop img{width:100%;height:100%;object-fit:cover;filter:blur(26px) brightness(.42);transform:scale(1.2)}
.backdrop::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,17,22,.45),var(--bg))}
.dclose{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:3;width:36px;height:36px;
border-radius:11px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);color:#fff;
font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dcontent{position:relative;z-index:2;padding:calc(60px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
.dposter{width:158px;aspect-ratio:2/3;margin:0 auto;border-radius:16px;overflow:hidden;background:var(--bg2);
box-shadow:0 18px 44px rgba(0,0,0,.6);position:relative}
.dposter img{width:100%;height:100%;object-fit:cover;display:block}
.dtitle{text-align:center;font-size:20px;font-weight:700;line-height:1.3;margin:18px 0 0}
.dmeta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{padding:6px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line);
font-size:11px;font-weight:600;color:var(--dim)}
.panel{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}
.panel h4{margin:0 0 12px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
.note{text-align:center;font-size:11px;color:var(--dim);margin-top:12px;line-height:1.6}
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(21,26,33,.96);
backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{flex:1;padding:11px 0 9px;text-align:center;font-size:11px;font-weight:600;color:var(--dim);cursor:pointer}
nav div .ni{display:block;font-size:19px;margin-bottom:2px}
nav div.on{color:var(--accent)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
color:var(--dim);margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px;border-radius:11px;background:var(--bg2);
border:1px solid var(--line);color:var(--txt);font-size:14px;outline:none;font-family:inherit}
.field input:focus{border-color:var(--accent)}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
.check{display:flex;align-items:center;gap:9px;font-size:13px;color:#c6d0dc;margin:4px 0 14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.stat{display:flex;gap:10px;margin-bottom:14px}
.statbox{flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px}
.statbox .v{font-size:20px;font-weight:800}
.statbox .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.alert{padding:11px 13px;border-radius:11px;font-size:12px;line-height:1.55;margin-bottom:14px}
.alert.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);color:#fcd34d}
.alert.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac}
.arow{display:flex;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:13px;
padding:10px;margin-bottom:10px}
.athumb{width:46px;height:69px;border-radius:9px;overflow:hidden;background:var(--bg2);flex:0 0 auto;position:relative}
.athumb img{width:100%;height:100%;object-fit:cover}
.ainfo{flex:1;min-width:0}
.aname{font-size:13px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ameta{font-size:11px;color:var(--dim);margin-top:3px}
.alink{font-size:10px;color:#5b6675;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abtns{display:flex;gap:6px;margin-top:8px}
.abtns button{padding:6px 11px;font-size:11px;border-radius:8px;border:1px solid var(--line);
background:var(--bg2);color:var(--txt);font-weight:600;cursor:pointer}
.abtns button.d{color:#fca5a5;border-color:rgba(239,68,68,.3)}
.preview{width:74px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--bg2);
margin-top:8px;position:relative;display:none}
.preview.show{display:block}
.preview img{width:100%;height:100%;object-fit:cover}
.toast{position:fixed;left:14px;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:90;
padding:13px 15px;border-radius:12px;background:#1f2937;border:1px solid var(--line);font-size:13px;
font-weight:600;box-shadow:0 12px 34px rgba(0,0,0,.5);opacity:0;transform:translateY(14px);
transition:.22s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{border-color:rgba(34,197,94,.45)}
.toast.bad{border-color:rgba(239,68,68,.45)}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="logo">🎬</div>
    <div>
      <div class="htitle" id="brand">Movies</div>
      <div class="hsub" id="sub">Loading…</div>
    </div>
    <div class="iconbtn" id="refresh">⟳</div>
  </div>
  <div class="search" id="searchWrap">
    <span class="ico">🔍</span>
    <input id="q" type="search" placeholder="Search…" autocomplete="off">
  </div>
</header>

<div id="viewLibrary">
  <div class="chips" id="chips"></div>
  <div class="wrap">
    <div class="grid" id="grid"></div>
    <div class="state hidden" id="state"></div>
  </div>
</div>

<div id="viewAdmin" class="hidden">
  <div class="wrap" style="padding-top:14px">
    <div id="adminAlert"></div>
    <div class="stat">
      <div class="statbox"><div class="v" id="stTitles">0</div><div class="k">Titles</div></div>
      <div class="statbox"><div class="v" id="stStore">—</div><div class="k">Storage</div></div>
    </div>

    <div class="panel">
      <h4 id="formTitle">Add new title</h4>
      <div class="field"><label>Name</label><input id="fName" placeholder="Movie name"></div>
      <div class="field"><label>Download link</label><input id="fLink" placeholder="https://…"></div>
      <div class="row2">
        <div class="field"><label>Size</label><input id="fSize" placeholder="1.8GB"></div>
        <div class="field"><label>Quality</label><input id="fQuality" placeholder="1080p"></div>
      </div>
      <div class="field">
        <label>Poster URL</label>
        <input id="fPoster" placeholder="https://image.tmdb.org/…jpg">
        <div class="preview" id="fPreview"><div class="ph" style="font-size:22px">🎬</div><img id="fPrevImg" alt=""></div>
      </div>
      <label class="check"><input type="checkbox" id="fPost" checked> Channel par post karo</label>
      <button class="btn wide" id="fSave">➕ Add Title</button>
      <button class="btn wide ghost hidden" id="fCancel" style="margin-top:8px">Cancel edit</button>
    </div>

    <div class="panel">
      <h4>Library (<span id="adminCount">0</span>)</h4>
      <div class="field" style="margin-bottom:12px">
        <input id="aq" placeholder="Filter by name…">
      </div>
      <div id="adminList"></div>
    </div>
  </div>
</div>

<div class="detail" id="detail">
  <div class="backdrop" id="backdrop"></div>
  <div class="dclose" id="dclose">✕</div>
  <div class="dcontent" id="dcontent"></div>
</div>

<nav>
  <div id="tabLib" class="on"><span class="ni">🎬</span>Library</div>
  <div id="tabAdmin" class="hidden"><span class="ni">⚙️</span>Admin</div>
</nav>

<div class="toast" id="toast"></div>

<script>
var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
var S = {initData:'', movies:[], admin:[], brand:'Movies', bot:'', isAdmin:false,
         q:'', filter:'all', aq:'', editing:null, tab:'lib', busy:false};

function el(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function hap(k){try{if(!tg||!tg.HapticFeedback)return;
  if(k==='select')tg.HapticFeedback.selectionChanged();
  else tg.HapticFeedback.impactOccurred(k||'light');}catch(e){}}
function toast(msg,kind){var t=el('toast');t.textContent=msg;
  t.className='toast show '+(kind||'');clearTimeout(t._t);
  t._t=setTimeout(function(){t.className='toast '+(kind||'');},2600);}

function api(path,body){
  return fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Init-Data':S.initData},
    body:JSON.stringify(body||{})}).then(function(r){
      return r.json().then(function(d){ if(!r.ok||d.ok===false) throw new Error(d.error||d.reason||('HTTP '+r.status)); return d; });
    });
}

(function init(){
  if(!tg) return;
  try{tg.ready();tg.expand();}catch(e){}
  try{tg.setHeaderColor('#0e1116');tg.setBackgroundColor('#0e1116');}catch(e){}
  try{if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();}catch(e){}
  try{var a=tg.themeParams&&tg.themeParams.button_color;
    if(a)document.documentElement.style.setProperty('--accent',a);}catch(e){}
  try{tg.BackButton.onClick(function(){ if(el('detail').classList.contains('open')) closeDetail(); });}catch(e){}
  S.initData = tg.initData || '';
})();

/* ── boot ── */
function boot(){
  skeleton();
  var sess = S.initData ? api('/api/session') : Promise.resolve({is_admin:false,authed:false});
  sess.then(function(s){
    S.isAdmin = !!s.is_admin;
    el('tabAdmin').classList.toggle('hidden', !S.isAdmin);
  }).catch(function(){ S.isAdmin=false; el('tabAdmin').classList.add('hidden'); })
  .then(loadPublic)
  .then(function(){ if(S.isAdmin) return refreshAdmin(); });
}

function loadPublic(){
  return fetch('/api/movies',{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(d){
      S.movies=d.movies||[]; S.brand=d.brand||'Movies'; S.bot=d.bot||'';
      el('brand').textContent=S.brand.replace(/^[^\w]+/,'').trim()||'Movies';
      buildChips(); renderGrid();
    }).catch(function(e){ showLibError(e.message); });
}

function skeleton(){
  el('state').classList.add('hidden');
  var h='';for(var i=0;i<6;i++)h+='<div class="sk"><div class="a"></div><div class="b"></div><div class="c"></div></div>';
  el('grid').innerHTML=h;
}
function showLibError(m){
  el('grid').innerHTML='';var s=el('state');s.classList.remove('hidden');
  s.innerHTML='<div class="em">📡</div><h3>Load nahi hua</h3><p>'+esc(m)+'</p>'+
    '<button class="btn" style="margin-top:16px" onclick="boot()">Retry</button>';
  el('sub').textContent='Connection error';
}

/* ── library ── */
function buildChips(){
  var seen={},list=[];
  S.movies.forEach(function(m){var q=(m.quality||'').trim();
    if(q&&q!=='-'&&!seen[q.toLowerCase()]){seen[q.toLowerCase()]=1;list.push(q);}});
  var h='<div class="chip'+(S.filter==='all'?' on':'')+'" data-f="all">All</div>';
  list.forEach(function(q){h+='<div class="chip'+(S.filter===q?' on':'')+'" data-f="'+esc(q)+'">'+esc(q)+'</div>';});
  el('chips').innerHTML=h;
  Array.prototype.forEach.call(el('chips').children,function(c){
    c.onclick=function(){S.filter=c.getAttribute('data-f');hap('select');buildChips();renderGrid();};});
}
function visible(){
  var q=S.q.toLowerCase().trim();
  return S.movies.filter(function(m){
    if(S.filter!=='all'&&(m.quality||'')!==S.filter)return false;
    if(q&&(m.name||'').toLowerCase().indexOf(q)===-1)return false;return true;});
}
function posterHTML(m){
  var h='<div class="ph">🎬</div>';
  if(m.poster)h+='<img src="'+esc(m.poster)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
  return h;
}
function renderGrid(){
  var list=visible();
  el('sub').textContent=S.movies.length+' titles'+(list.length!==S.movies.length?' · '+list.length+' shown':'');
  if(!list.length){
    el('grid').innerHTML='';var s=el('state');s.classList.remove('hidden');
    s.innerHTML=S.movies.length
      ? '<div class="em">🔍</div><h3>Kuch nahi mila</h3><p>Search badal kar dekhein.</p>'
      : '<div class="em">📭</div><h3>Library khali hai</h3><p>Admin abhi titles add karega.</p>';
    return;
  }
  el('state').classList.add('hidden');
  var h='';
  list.forEach(function(m){
    h+='<div class="card" data-id="'+esc(m.id)+'"><div class="poster">'+posterHTML(m)+
      (m.quality&&m.quality!=='-'?'<div class="qbadge">'+esc(m.quality)+'</div>':'')+
      '</div><div class="cbody"><div class="cname">'+esc(m.name)+'</div>'+
      '<div class="csize">📦 '+esc(m.size)+'</div></div></div>';
  });
  el('grid').innerHTML=h;
  Array.prototype.forEach.call(el('grid').children,function(c){
    c.onclick=function(){openDetail(c.getAttribute('data-id'));};});
}

/* ── detail + access ── */
function openDetail(id){
  var m=null;for(var i=0;i<S.movies.length;i++)if(S.movies[i].id===id){m=S.movies[i];break;}
  if(!m)return; hap('light');
  el('backdrop').innerHTML=m.poster?'<img src="'+esc(m.poster)+'" alt="" onerror="this.style.display=\'none\'">':'';
  el('dcontent').innerHTML=
    '<div class="dposter">'+posterHTML(m)+'</div>'+
    '<div class="dtitle">'+esc(m.name)+'</div>'+
    '<div class="dmeta"><div class="tag">📦 '+esc(m.size)+'</div><div class="tag">🎞 '+esc(m.quality)+'</div></div>'+
    '<div id="accessBox"></div>'+
    '<div class="note">Members only · Channel join zaroori hai</div>';
  el('detail').classList.add('open');
  document.body.style.overflow='hidden';
  try{if(tg)tg.BackButton.show();}catch(e){}
  renderAccessIdle(m);
}
function closeDetail(){
  el('detail').classList.remove('open');document.body.style.overflow='';
  try{if(tg)tg.BackButton.hide();}catch(e){}
}
function renderAccessIdle(m){
  el('accessBox').innerHTML='<button class="btn wide" id="accBtn" style="margin-top:20px">⬇️ Get Download Link</button>';
  el('accBtn').onclick=function(){requestAccess(m);};
}
function requestAccess(m){
  if(!S.initData){
    el('accessBox').innerHTML='<div class="alert warn" style="margin-top:18px">App ko Telegram ke andar kholen — browser mein access verify nahi ho sakta.</div>';
    return;
  }
  el('accessBox').innerHTML='<button class="btn wide" disabled style="margin-top:20px">⏳ Checking membership…</button>';
  api('/api/access',{id:m.id}).then(function(d){
    hap('medium');
    el('accessBox').innerHTML=
      '<div class="alert ok" style="margin-top:18px">✅ Membership verified — download ready.</div>'+
      '<button class="btn wide" id="dlBtn">⬇️ Download Now</button>'+
      '<button class="btn wide ghost" id="againBtn" style="margin-top:8px">↻ Refresh link</button>';
    el('dlBtn').onclick=function(){hap('medium');openLink(d.link);};
    el('againBtn').onclick=function(){requestAccess(m);};
  }).catch(function(err){
    var msg=String(err.message||err);
    if(msg.indexOf('need_join')>-1||msg==='need_join'){ renderJoin(m,''); return; }
    api('/api/access',{id:m.id}).catch(function(){});
    renderJoinOrError(m,msg);
  });
}
function renderJoinOrError(m,msg){
  fetch('/api/movies').then(function(){ });
  el('accessBox').innerHTML=
    '<div class="alert warn" style="margin-top:18px">🔒 Channel join karna zaroori hai.</div>'+
    '<button class="btn wide" id="joinBtn">📢 Join Channel</button>'+
    '<button class="btn wide ghost" id="joinedBtn" style="margin-top:8px">✅ I Joined — Check again</button>'+
    '<div class="note">'+esc(msg)+'</div>';
  el('joinBtn').onclick=function(){
    var url=S.bot?'https://t.me/'+S.bot:'';
    api('/api/access',{id:m.id}).then(function(d){ if(d.link) openLink(d.link); })
      .catch(function(){ if(tg&&tg.openTelegramLink&&url)tg.openTelegramLink(url); });
  };
  el('joinedBtn').onclick=function(){requestAccess(m);};
}
function renderJoin(m,url){
  el('accessBox').innerHTML=
    '<div class="alert warn" style="margin-top:18px">🔒 Channel join karna zaroori hai.</div>'+
    '<button class="btn wide" id="joinBtn">📢 Join Channel</button>'+
    '<button class="btn wide ghost" id="joinedBtn" style="margin-top:8px">✅ I Joined — Check again</button>';
  el('joinBtn').onclick=function(){ if(url)openLink(url); };
  el('joinedBtn').onclick=function(){requestAccess(m);};
}
function openLink(u){ if(tg&&tg.openLink)tg.openLink(u); else window.location.href=u; }

/* ── admin ── */
function refreshAdmin(){
  return Promise.all([api('/api/admin/status'),api('/api/admin/movies')]).then(function(r){
    var st=r[0],ls=r[1];
    S.admin=ls.movies||[];
    el('stTitles').textContent=st.titles;
    el('stStore').textContent=st.storage.ok?'OK':'⚠';
    el('stStore').style.color=st.storage.ok?'var(--ok)':'var(--warn)';
    el('adminAlert').innerHTML=st.storage.ok
      ? '<div class="alert ok">💾 Database channel mein pinned hai — restart safe.</div>'
      : '<div class="alert warn">⚠️ '+esc(st.storage.error||'Storage problem')+'<br>Bot ko private channel mein <b>Pin Messages</b> right do.</div>';
    renderAdminList();
  }).catch(function(e){ toast(e.message,'bad'); });
}
function renderAdminList(){
  var q=S.aq.toLowerCase().trim();
  var list=S.admin.filter(function(m){return !q||(m.name||'').toLowerCase().indexOf(q)>-1;});
  el('adminCount').textContent=S.admin.length;
  if(!list.length){el('adminList').innerHTML='<div class="note">Koi title nahi.</div>';return;}
  var h='';
  list.forEach(function(m){
    h+='<div class="arow"><div class="athumb">'+(m.poster?'<img src="'+esc(m.poster)+'" onerror="this.style.display=\'none\'">':'<div class="ph" style="font-size:18px">🎬</div>')+'</div>'+
      '<div class="ainfo"><div class="aname">'+esc(m.name)+'</div>'+
      '<div class="ameta">📦 '+esc(m.size)+' · 🎞 '+esc(m.quality)+'</div>'+
      '<div class="alink">'+esc(m.link)+'</div>'+
      '<div class="abtns"><button data-a="edit" data-id="'+esc(m.id)+'">✏️ Edit</button>'+
      '<button data-a="post" data-id="'+esc(m.id)+'">📢 Repost</button>'+
      '<button data-a="del" data-id="'+esc(m.id)+'" class="d">🗑 Delete</button></div></div></div>';
  });
  el('adminList').innerHTML=h;
  Array.prototype.forEach.call(el('adminList').querySelectorAll('button'),function(b){
    b.onclick=function(){adminAction(b.getAttribute('data-a'),b.getAttribute('data-id'));};});
}
function findAdmin(id){for(var i=0;i<S.admin.length;i++)if(S.admin[i].id===id)return S.admin[i];return null;}
function adminAction(a,id){
  var m=findAdmin(id); if(!m)return; hap('select');
  if(a==='edit'){
    S.editing=id;
    el('fName').value=m.name||'';el('fLink').value=m.link||'';
    el('fSize').value=m.size||'';el('fQuality').value=m.quality||'';
    el('fPoster').value=m.poster||'';el('fPost').checked=false;
    el('formTitle').textContent='Edit title';
    el('fSave').textContent='💾 Update Title';
    el('fCancel').classList.remove('hidden');
    updatePreview(); window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  if(a==='del'){
    var go=function(){
      api('/api/admin/delete',{id:id}).then(function(){toast('Deleted','ok');return refreshAdmin();})
        .then(loadPublic).catch(function(e){toast(e.message,'bad');});
    };
    if(tg&&tg.showConfirm)tg.showConfirm('Delete "'+m.name+'"?',function(ok){if(ok)go();});
    else if(confirm('Delete "'+m.name+'"?'))go();
    return;
  }
  if(a==='post'){
    api('/api/admin/repost',{id:id}).then(function(){toast('Channel par post ho gaya','ok');return refreshAdmin();})
      .catch(function(e){toast(e.message,'bad');});
  }
}
function resetForm(){
  S.editing=null;
  el('fName').value='';el('fLink').value='';el('fSize').value='';
  el('fQuality').value='';el('fPoster').value='';el('fPost').checked=true;
  el('formTitle').textContent='Add new title';
  el('fSave').textContent='➕ Add Title';
  el('fCancel').classList.add('hidden');
  updatePreview();
}
function updatePreview(){
  var u=el('fPoster').value.trim();
  var box=el('fPreview'),img=el('fPrevImg');
  if(!u){box.classList.remove('show');img.removeAttribute('src');return;}
  box.classList.add('show');img.src=u;
  img.onerror=function(){img.style.display='none';};
  img.onload=function(){img.style.display='block';};
}
function saveForm(){
  if(S.busy)return;
  var body={name:el('fName').value.trim(),link:el('fLink').value.trim(),
    size:el('fSize').value.trim()||'-',quality:el('fQuality').value.trim()||'-',
    poster:el('fPoster').value.trim(),post:el('fPost').checked};
  if(!body.name){toast('Name daalein','bad');return;}
  if(!/^https?:\/\//.test(body.link)){toast('Link https:// se shuru ho','bad');return;}
  S.busy=true;el('fSave').disabled=true;
  var p = S.editing ? api('/api/admin/update',Object.assign({id:S.editing},body))
                    : api('/api/admin/add',body);
  p.then(function(d){
    hap('medium');
    toast(S.editing?'Updated':'Added','ok');
    if(d.warnings&&d.warnings.length)toast('⚠ '+d.warnings[0],'bad');
    resetForm();return refreshAdmin();
  }).then(loadPublic)
   .catch(function(e){toast(e.message,'bad');})
   .then(function(){S.busy=false;el('fSave').disabled=false;});
}

/* ── tabs ── */
function setTab(t){
  S.tab=t;hap('select');
  el('tabLib').classList.toggle('on',t==='lib');
  el('tabAdmin').classList.toggle('on',t==='admin');
  el('viewLibrary').classList.toggle('hidden',t!=='lib');
  el('viewAdmin').classList.toggle('hidden',t!=='admin');
  el('searchWrap').classList.toggle('hidden',t!=='lib');
  el('sub').textContent = t==='admin' ? 'Admin panel' : S.movies.length+' titles';
  if(t==='admin')refreshAdmin();
}

/* ── events ── */
el('dclose').onclick=function(){hap('light');closeDetail();};
el('refresh').onclick=function(){hap('light');el('refresh').classList.add('spin');
  boot().then(function(){el('refresh').classList.remove('spin');});};
el('tabLib').onclick=function(){setTab('lib');};
el('tabAdmin').onclick=function(){setTab('admin');};
el('fSave').onclick=saveForm;
el('fCancel').onclick=function(){hap('light');resetForm();};
el('fPoster').addEventListener('change',updatePreview);
el('fPoster').addEventListener('blur',updatePreview);
var t1=null;el('q').addEventListener('input',function(e){S.q=e.target.value;
  clearTimeout(t1);t1=setTimeout(renderGrid,140);});
var t2=null;el('aq').addEventListener('input',function(e){S.aq=e.target.value;
  clearTimeout(t2);t2=setTimeout(renderAdminList,140);});

boot();
</script>
</body>
</html>
