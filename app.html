<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FlixOrange</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --smooth: cubic-bezier(.22, 1, .36, 1);
  }
  :root, [data-theme="dark"] {
    --bg: #0b0b0d;
    --surface: #17171b;
    --surface2: #222228;
    --text: #f5f5f5;
    --muted: #a8a8b3;
    --border: rgba(255,255,255,.1);
    --nav: rgba(14,14,17,.55);
    --accent: #ff7a00;
    --accent2: #ffa040;
    --shadow: 0 20px 50px rgba(0,0,0,.6);
    --ga: rgba(255,255,255,.13);
    --gb: rgba(255,255,255,.035);
    --gborder: rgba(255,255,255,.17);
    --ghi: rgba(255,255,255,.34);
    --glo: rgba(255,255,255,.07);
    --gshadow: 0 14px 40px rgba(0,0,0,.5);
    --gring: rgba(255,255,255,0);
    --sheen: rgba(255,255,255,.16);
    --chipbg: rgba(255,255,255,.1);
    --blob: .22;
  }
  [data-theme="light"] {
    --bg: #ffffff;
    --surface: #fff4e8;
    --surface2: #ffe6cc;
    --text: #1b1209;
    --muted: #7d6c5a;
    --border: rgba(255,122,0,.22);
    --nav: rgba(255,255,255,.6);
    --accent: #ff6a00;
    --accent2: #ff9440;
    --shadow: 0 20px 45px rgba(255,106,0,.22);
    --ga: rgba(255,255,255,.85);
    --gb: rgba(255,238,220,.5);
    --gborder: rgba(255,255,255,.95);
    --ghi: #ffffff;
    --glo: rgba(255,122,0,.16);
    --gshadow: 0 14px 38px rgba(255,106,0,.2);
    --gring: rgba(255,122,0,.14);
    --sheen: rgba(255,255,255,.9);
    --chipbg: rgba(255,122,0,.1);
    --blob: .3;
  }
  * { -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); transition: background .5s var(--smooth), color .4s; overflow-x: hidden; }
  .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: .04em; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  .ic { display: block; flex-shrink: 0; }
  main, footer { position: relative; z-index: 1; }

  /* ---------- ambient blobs ---------- */
  .blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: var(--blob); z-index: 0; pointer-events: none; background: radial-gradient(circle, var(--accent), transparent 70%); }
  .b1 { width: 420px; height: 420px; top: 8%; left: -120px; animation: float1 16s ease-in-out infinite; }
  .b2 { width: 360px; height: 360px; top: 45%; right: -100px; animation: float2 19s ease-in-out infinite; }
  .b3 { width: 460px; height: 460px; bottom: -160px; left: 30%; animation: float1 22s ease-in-out infinite reverse; }
  @keyframes float1 { 50% { transform: translate(90px, 70px) scale(1.15); } }
  @keyframes float2 { 50% { transform: translate(-80px, -90px) scale(.9); } }

  /* ---------- liquid glass ---------- */
  .glass {
    background:
      radial-gradient(120% 90% at 12% 0%, var(--sheen), transparent 55%),
      linear-gradient(135deg, var(--ga), var(--gb));
    -webkit-backdrop-filter: blur(22px) saturate(190%);
    backdrop-filter: blur(22px) saturate(190%);
    border: 1px solid var(--gborder);
    box-shadow: inset 0 1px 1px var(--ghi), inset 0 -10px 18px -12px var(--glo), 0 0 0 1px var(--gring), var(--gshadow);
  }
  .nav {
    background: var(--nav);
    -webkit-backdrop-filter: blur(22px) saturate(190%);
    backdrop-filter: blur(22px) saturate(190%);
    border-bottom: 1px solid var(--gborder);
    box-shadow: inset 0 -1px 0 var(--glo), 0 8px 30px rgba(0,0,0,.12);
  }
  .nav-item { transition: opacity .35s var(--smooth), transform .5s var(--spring); }
  body.sopen .nav-item { opacity: 0; transform: scale(.85); pointer-events: none; }

  /* ---------- buttons ---------- */
  button { font-family: inherit; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 600; border-radius: 999px; border: none; cursor: pointer; transition: transform .5s var(--spring), box-shadow .3s; box-shadow: 0 10px 26px rgba(255,122,0,.4), inset 0 1px 1px rgba(255,255,255,.55); }
  .btn-primary:hover { transform: translateY(-3px) scale(1.06); box-shadow: 0 16px 34px rgba(255,122,0,.55), inset 0 1px 1px rgba(255,255,255,.55); }
  .btn-ghost { color: #fff; font-weight: 600; border-radius: 999px; cursor: pointer; background: linear-gradient(135deg, rgba(255,255,255,.26), rgba(255,255,255,.08)); -webkit-backdrop-filter: blur(16px) saturate(180%); backdrop-filter: blur(16px) saturate(180%); border: 1px solid rgba(255,255,255,.3); box-shadow: inset 0 1px 1px rgba(255,255,255,.45), 0 8px 22px rgba(0,0,0,.25); transition: transform .5s var(--spring), background .3s; }
  .btn-ghost:hover { transform: translateY(-3px) scale(1.06); background: linear-gradient(135deg, rgba(255,255,255,.36), rgba(255,255,255,.14)); }
  .btn-ghost.dark { color: var(--text); background: var(--chipbg); border-color: var(--gborder); box-shadow: inset 0 1px 1px var(--ghi); }
  .icon-btn { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; color: var(--text); cursor: pointer; transition: transform .5s var(--spring), background .3s, color .3s; }
  .icon-btn:hover { transform: scale(1.15) rotate(-6deg); color: var(--accent); }
  button:active:not(:disabled) { transform: scale(.88) !important; }
  button:disabled { opacity: .55; cursor: default; }
  .spin svg { animation: spinpop .8s var(--spring); }
  @keyframes spinpop { from { transform: rotate(-200deg) scale(.3); opacity: 0; } }

  .chip { padding: 8px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; background: var(--chipbg); border: 1px solid var(--gborder); color: var(--muted); cursor: pointer; transition: transform .45s var(--spring), background .3s, color .3s, box-shadow .3s; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: inset 0 1px 1px var(--ghi); }
  .chip:hover { color: var(--text); transform: translateY(-2px) scale(1.06); }
  .chip.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; box-shadow: 0 8px 20px rgba(255,122,0,.4), inset 0 1px 1px rgba(255,255,255,.5); transform: scale(1.05); }
  .chip.sm { padding: 6px 14px; font-size: 12px; }

  /* ---------- hero ---------- */
  .hero { position: relative; height: min(86vh, 700px); min-height: 520px; overflow: hidden; }
  .hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease; pointer-events: none; }
  .hero-slide.active { opacity: 1; pointer-events: auto; }
  .hero-slide img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.1); transition: transform 8s ease-out; }
  .hero-slide.active img { transform: scale(1); }
  .hero-shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.55) 40%, rgba(0,0,0,.05) 80%), linear-gradient(0deg, var(--bg) 0%, transparent 35%); }
  .hero-content > * { opacity: 0; transform: translateY(30px) scale(.96); }
  .hero-slide.active .hero-content > * { animation: rise .9s var(--spring) forwards; }
  .hero-slide.active .hero-content > *:nth-child(2) { animation-delay: .1s; }
  .hero-slide.active .hero-content > *:nth-child(3) { animation-delay: .2s; }
  .hero-slide.active .hero-content > *:nth-child(4) { animation-delay: .3s; }
  .hero-slide.active .hero-content > *:nth-child(5) { animation-delay: .4s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .dot { height: 7px; width: 7px; border-radius: 7px; background: rgba(255,255,255,.45); cursor: pointer; transition: all .6s var(--spring); }
  .dot.active { width: 44px; background: var(--accent); box-shadow: 0 0 14px rgba(255,122,0,.8); }

  /* ---------- rows ---------- */
  .row-wrap { position: relative; }
  .row-scroll { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x proximity; padding: 16px 6px 26px; scroll-behavior: smooth; }
  .row-arrow { position: absolute; top: 50%; transform: translateY(-60%); z-index: 20; width: 46px; height: 46px; border-radius: 999px; color: var(--text); display: none; place-items: center; opacity: 0; transition: opacity .3s, transform .5s var(--spring); cursor: pointer; }
  .row-wrap:hover .row-arrow { opacity: 1; }
  .row-arrow:hover { transform: translateY(-60%) scale(1.18) !important; color: var(--accent); }
  .row-arrow.l { left: -10px; } .row-arrow.r { right: -10px; }
  @media (min-width: 768px) { .row-arrow { display: grid; } }

  .reveal { opacity: 0; transform: translateY(36px) scale(.97); transition: opacity .7s var(--smooth), transform .95s var(--spring); }
  .reveal.in { opacity: 1; transform: none; }
  .reveal.in .card, .stag .card, .stag .lrow { animation: bubble .75s var(--spring) backwards; animation-delay: calc(var(--i, 0) * 55ms + 100ms); }
  .stag .card, .stag .lrow { animation-delay: calc(var(--i, 0) * 35ms); animation-duration: .6s; }
  @keyframes bubble { from { opacity: 0; transform: translateY(26px) scale(.78); } }
  .view-in { animation: viewin .7s var(--spring); }
  @keyframes viewin { from { opacity: 0; transform: translateY(24px) scale(.985); } }

  .card { position: relative; flex: 0 0 auto; width: 160px; aspect-ratio: 2/3; border-radius: 18px; overflow: hidden; cursor: pointer; scroll-snap-align: start; background: var(--surface2); transition: transform .55s var(--spring), box-shadow .4s, outline-color .3s; outline: 2px solid transparent; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
  .card.wide { width: 280px; aspect-ratio: 16/9; }
  @media (min-width: 768px) { .card { width: 190px; } .card.wide { width: 320px; } }
  .card:hover { transform: scale(1.09) translateY(-6px); box-shadow: var(--shadow); z-index: 10; outline-color: var(--accent); }
  .card:active:not(:has(button:active)) { transform: scale(.95); }
  .card img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s var(--smooth); }
  .card:hover img { transform: scale(1.08); }
  .card .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 40px; background: linear-gradient(150deg, var(--surface2), var(--surface)); color: var(--muted); }
  .card .info { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; background: linear-gradient(0deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.2) 55%, transparent 100%); color: #fff; }
  .card .hover-only { max-height: 0; opacity: 0; overflow: hidden; transition: all .45s var(--spring); }
  .card:hover .hover-only { max-height: 60px; opacity: 1; margin-top: 6px; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #fff; letter-spacing: .04em; }
  .badge-o { border: 1px solid rgba(255,255,255,.5); background: transparent; }
  .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.25); }
  .progress > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .heart { position: absolute; top: 9px; right: 9px; width: 32px; height: 32px; border-radius: 999px; background: rgba(0,0,0,.4); -webkit-backdrop-filter: blur(10px) saturate(180%); backdrop-filter: blur(10px) saturate(180%); border: 1px solid rgba(255,255,255,.25); box-shadow: inset 0 1px 1px rgba(255,255,255,.35); display: grid; place-items: center; color: #fff; z-index: 5; cursor: pointer; transition: transform .5s var(--spring), background .3s; }
  .heart:hover { background: var(--accent); transform: scale(1.2) rotate(8deg); }
  [data-heart].on { background: var(--accent) !important; color: #fff; }
  [data-heart].pop svg { animation: heartpop .6s var(--spring); }
  @keyframes heartpop { 0% { transform: scale(.2) rotate(-40deg); } 60% { transform: scale(1.5) rotate(10deg); } 100% { transform: none; } }

  .top-item { position: relative; flex: 0 0 auto; display: flex; align-items: flex-end; scroll-snap-align: start; }
  .top-num { font-family: 'Bebas Neue', sans-serif; font-size: 150px; line-height: .8; margin-right: -26px; margin-bottom: 4px; color: transparent; -webkit-text-stroke: 3px var(--accent); z-index: 1; user-select: none; filter: drop-shadow(0 0 14px rgba(255,122,0,.35)); }
  .top-item .card { z-index: 2; }
  @media (max-width: 640px) { .top-num { font-size: 110px; margin-right: -20px; } }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
  .grid-cards .card { width: 100%; }
  @media (min-width: 768px) { .grid-cards { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }

  /* ---------- modal ---------- */
  .overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.7); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 4vh 12px; }
  .overlay.open { display: flex; animation: fade .3s; }
  @keyframes fade { from { opacity: 0; } }
  .modal { width: 100%; max-width: 860px; background: var(--bg); border-radius: 28px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); animation: pop .6s var(--spring); }
  @keyframes pop { from { transform: translateY(60px) scale(.88); opacity: 0; } }
  .modal-hero { position: relative; height: 380px; }
  .modal-hero img { width: 100%; height: 100%; object-fit: cover; }
  .modal-hero .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 70px; background: linear-gradient(150deg, var(--surface2), var(--surface)); color: var(--muted); }
  .modal-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg) 0%, transparent 60%); }
  .mini { border-radius: 20px; overflow: hidden; cursor: pointer; background: var(--surface); border: 1px solid var(--border); transition: transform .5s var(--spring), box-shadow .3s; }
  .mini:hover { transform: translateY(-6px) scale(1.04); box-shadow: var(--shadow); }

  /* ---------- access panel ---------- */
  .acc { border-radius: 24px; padding: 18px; background: var(--chipbg); border: 1px solid var(--gborder); box-shadow: inset 0 1px 1px var(--ghi); animation: bubble .6s var(--spring); }
  .acc-t { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .acc-p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .acc-ico { width: 38px; height: 38px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: inset 0 1px 1px rgba(255,255,255,.5); flex-shrink: 0; }
  .acc-ico.ok { background: linear-gradient(135deg, #16a34a, #4ade80); }
  .acc-ico.lock { background: linear-gradient(135deg, #6b7280, #9ca3af); }
  .dots-load { display: inline-flex; gap: 5px; align-items: center; }
  .dots-load i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1s infinite; }
  .dots-load i:nth-child(2) { animation-delay: .15s; } .dots-load i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,100% { transform: translateY(0); opacity: .4; } 50% { transform: translateY(-7px); opacity: 1; } }

  .toast { position: fixed; left: 50%; bottom: 100px; transform: translate(-50%, 40px) scale(.7); color: var(--text); padding: 11px 22px; border-radius: 999px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: all .55s var(--spring); z-index: 300; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  /* ---------- bottom pill dock ---------- */
  .dock { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50; display: flex; gap: 4px; padding: 7px; border-radius: 999px; max-width: calc(100vw - 16px); animation: dockin 1s var(--spring) .4s backwards; }
  @keyframes dockin { from { transform: translate(-50%, 140px) scale(.7); opacity: 0; } }
  .dk { position: relative; display: flex; align-items: center; justify-content: center; height: 46px; min-width: 46px; padding: 0 12px; border-radius: 999px; color: var(--muted); border: none; background: transparent; cursor: pointer; transition: background .45s var(--smooth), color .3s, padding .55s var(--spring), transform .45s var(--spring), box-shadow .4s; }
  .dk:hover { color: var(--text); transform: translateY(-4px) scale(1.1); }
  .dk-l { display: inline-block; max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; font-size: 12.5px; font-weight: 600; margin-left: 0; transition: max-width .6s var(--spring), opacity .3s, margin .6s var(--spring); }
  .dk.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 8px 20px rgba(255,122,0,.5), inset 0 1px 1px rgba(255,255,255,.6); }
  .dk.active:hover { transform: translateY(-3px) scale(1.04); }
  .dk.active .dk-l { max-width: 72px; opacity: 1; margin-left: 7px; }
  .dk.active svg { animation: ibounce .7s var(--spring); }
  @keyframes ibounce { 0% { transform: scale(.5) rotate(-18deg); } 55% { transform: scale(1.35) rotate(8deg); } 100% { transform: none; } }
  .dk-badge { position: absolute; top: 3px; right: 3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; display: none; place-items: center; box-shadow: 0 0 0 2px var(--bg); transition: transform .5s var(--spring); }
  .dk.active .dk-badge { background: #fff; color: var(--accent); }
  .dk-badge.bump { animation: heartpop .6s var(--spring); }

  .sec-title { font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 10px; }
  .sec-title::before { content: ''; width: 5px; height: 22px; border-radius: 5px; background: linear-gradient(var(--accent2), var(--accent)); }
  ::selection { background: var(--accent); color: #fff; }
  mark { background: rgba(255,122,0,.3); color: inherit; border-radius: 5px; padding: 0 2px; }

  /* ---------- expanding search shell ---------- */
  .scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: opacity .5s var(--smooth); }
  [data-theme="light"] .scrim { background: rgba(60,25,0,.28); }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sh { position: fixed; z-index: 70; overflow: hidden; border-radius: 22px; cursor: pointer;
        transition: left .75s var(--spring), top .75s var(--spring), width .75s var(--spring), border-radius .6s var(--smooth), box-shadow .5s, transform .45s var(--spring); }
  .sh.nt { transition: none !important; }
  .sh:not(.open):hover { transform: scale(1.05); }
  .sh.open { border-radius: 28px; cursor: default; box-shadow: inset 0 1px 1px var(--ghi), 0 0 0 1px var(--gring), 0 30px 80px rgba(0,0,0,.5), 0 0 0 4px rgba(255,122,0,.18); }
  .sh-bar, .sc-bar .sx-bar { display: flex; align-items: center; gap: 8px; }
  .sh-bar { height: 42px; padding: 0 6px 0 14px; }
  .sh.open .sh-bar { height: 52px; padding: 0 8px 0 18px; transition: height .5s var(--spring); }
  .sh:not(.open) .sx-input { pointer-events: none; }
  .sx-input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text); font-size: 16px; font-family: inherit; font-weight: 500; text-overflow: ellipsis; }
  .sh:not(.open) .sx-input { font-size: 14px; }
  .sx-input::placeholder { color: var(--muted); opacity: 1; }
  .sx-input::-webkit-search-cancel-button { display: none; }
  .sh-ctl { display: flex; align-items: center; gap: 6px; max-width: 0; opacity: 0; overflow: hidden; transition: max-width .7s var(--spring), opacity .4s; }
  .sh.open .sh-ctl { max-width: 220px; opacity: 1; overflow: visible; }
  .sx-btn { position: relative; width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; display: grid; place-items: center; background: var(--chipbg); color: var(--text); border: none; cursor: pointer; box-shadow: inset 0 1px 1px var(--ghi); transition: transform .5s var(--spring), background .3s, color .3s; }
  .sx-btn:hover { transform: scale(1.14) rotate(-5deg); color: var(--accent); }
  .sx-btn.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .sx-btn.listening { background: var(--accent); color: #fff; animation: pulse 1.1s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,122,0,.6); } 100% { box-shadow: 0 0 0 14px rgba(255,122,0,0); } }
  .sx-bar:not(.has-q) [data-act="clear"] { display: none; }
  .sx-bar.has-q [data-act="mic"] { display: none; }
  .fbadge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 99px; background: #ff3b30; color: #fff; font-size: 10px; font-weight: 700; display: none; place-items: center; box-shadow: 0 0 0 2px var(--bg); }
  .sh-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .8s var(--smooth); }
  .sh.expanded .sh-body { grid-template-rows: 1fr; }
  .sh-inner { overflow: hidden; min-height: 0; }
  .sh-scroll { max-height: calc(100dvh - 96px); overflow-y: auto; padding: 4px 16px 20px; overscroll-behavior: contain; opacity: 0; transform: translateY(-14px); transition: opacity .5s .15s, transform .7s .1s var(--spring); }
  .sh.expanded .sh-scroll { opacity: 1; transform: none; }
  .sh-scroll::before { content: ''; display: block; height: 1px; background: var(--border); margin: 0 0 14px; }
  .sc-bar { border-radius: 999px; padding: 6px 8px 6px 20px; transition: box-shadow .4s, transform .5s var(--spring); }

const ico = (n, s = 20, c = '') => `<svg class="ic ${c}" width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${ICON[n] || ''}</svg>`;
function hydrateIcons(root = document) {

    const t = document.createElement('template');
    t.innerHTML = ico(el.dataset.ic, +el.dataset.s || 20);

const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
const INIT = tg ? (tg.initData || '') : '';
function hap(k) {
  try {
    if (!tg || !tg.HapticFeedback) return;
    if (k === 'select') tg.HapticFeedback.selectionChanged();
    else if (k === 'ok' || k === 'err') tg.HapticFeedback.notificationOccurred(k === 'ok' ? 'success' : 'error');
    else tg.HapticFeedback.impactOccurred(k || 'light');
  } catch (e) {}
}
function openExternal(u) { if (tg && tg.openLink) tg.openLink(u); else window.open(u, '_blank'); }
function openTg(u) { if (tg && tg.openTelegramLink) tg.openTelegramLink(u); else window.location.href = u; }
(function tgInit() {
  if (!tg) return;
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
  try { tg.BackButton.onClick(onBack); } catch (e) {}
})();
function syncBack() {
  if (!tg) return;
  const need = currentModal || shOpen || view === 'admin';

}

/* ---------- API ---------- */
function api(path, body) {
  return fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Init-Data': INIT },
    body: JSON.stringify(body || {})
  }).then(r => r.json().then(d => {
    if (!r.ok || d.ok === false) throw new Error(d.error || d.reason || ('HTTP ' + r.status));
    return d;
  }));
}

/* ---------- CARDS ---------- */
function heartBtn(m, size = 16) {

}
function imgOr(url, alt, cls) {
  if (!url) return `<div class="ph">${ico('movies', 40)}</div>`;
  return `<img src="${esc(url)}" alt="${esc(alt)}" loading="lazy" class="${cls || ''}" onerror="this.style.display='none'">`;
}
function card(m, o = {}) {
  const img = o.wide ? wide(m) : poster(m);
  const click = o.pick ? `pickResult('${m.id}')` : `openModal('${m.id}')`;
  const title = o.hl ? hl(m.name) : esc(m.name);
  const sub = metaLine(m);
  const pct = seen.indexOf(m.id) > -1 ? 100 : 0;
  return `<div class="card ${o.wide ? 'wide' : ''}" style="--i:${Math.min(o.i || 0, 14)}" onclick="${click}" title="${esc(m.name)}">
    ${img ? `<img src="${esc(img)}" alt="${esc(m.name)}" loading="lazy" onerror="this.style.display='none'">` : `<div class="ph">${ico('movies', 40)}</div>`}
    ${heartBtn(m)}
    <div class="info">
      <div class="flex items-center gap-1.5 text-[11px] mb-1">
        <span class="badge">${m.type === 'series' ? 'SERIES' : 'MOVIE'}</span>
        ${m.rating ? `<span class="flex items-center gap-1">${ico('star', 12)} ${m.rating}</span>` : `<span class="flex items-center gap-1">${esc(m.quality)}</span>`}
      </div>
      <div class="font-semibold text-sm leading-tight">${title}</div>
      <div class="hover-only text-[11px] text-white/80">${esc(sub)}</div>
    </div>
    ${o.progress && pct ? `<div class="progress"><i style="width:${pct}%"></i></div>` : ''}
  </div>`;
}
function row(title, items, id, kind = 'poster') {
  if (!items.length) return '';
  const html = items.map((m, i) => kind === 'top'
    ? `<div class="top-item"><span class="top-num">${i + 1}</span>${card(m, {i})}</div>`
    : card(m, {i, wide: kind === 'wide', progress: kind === 'wide'})).join('');
  return `<section class="mt-4 reveal">
    <h2 class="sec-title">${title}</h2>
    <div class="row-wrap">
      <button class="row-arrow glass l" onclick="scrollRow('${id}',-1)" aria-label="Scroll left">${ico('chevL', 22)}</button>
      <div class="row-scroll no-scrollbar" id="${id}">${html}</div>
      <button class="row-arrow glass r" onclick="scrollRow('${id}',1)" aria-label="Scroll right">${ico('chevR', 22)}</button>
    </div>
  </section>`;
}
function scrollRow(id, dir) { const el = document.getElementById(id); el.scrollBy({left: dir * el.clientWidth * .8, behavior: 'smooth'}); }

let io;
function observeReveals() {
  const els = $$('.reveal:not(.in)');
  if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
  if (!io) io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold: .06, rootMargin: '0px 0px -4% 0px'});
  els.forEach(e => io.observe(e));
}

/* =====================================================================
   SEARCH SYSTEM (logic unchanged, data-driven)
   ===================================================================== */
const S = {
  q: '', type: 'all', genres: [], rating: 0, year: 'any', lang: 'any', sort: 'rel',
  layout: 'grid', filtersOpen: false, sugOpen: true, sel: -1, sugList: [],
  recent: JSON.parse(localStorage.getItem('fo_recent') || '[]')
};
const TYPEW = {movie: 'movie', movies: 'movie', film: 'movie', films: 'movie', series: 'series', show: 'series', shows: 'series'};
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const words = s => norm(s).split(/[^a-z0-9]+/).filter(Boolean);
function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
let YEARS = [], LANGS = [];
function buildIndex() {
  M.forEach(m => {
    m.genres = m.genres || []; m.cast = m.cast || [];
    m._t = norm(m.name); m._tw = words(m.name);
    m._cast = m.cast.map(c => ({n: c, l: norm(c), w: words(c)}));
    m._g = m.genres.map(norm); m._lang = norm(m.language); m._d = norm(m.description);
    m._v = [...new Set([...m._tw, ...m._cast.flatMap(c => c.w), ...m.genres.flatMap(words), ...words(m.language), ...words(m.quality)])];
  });
  VOCAB = [...new Set(M.flatMap(m => m._v))];
  YEARS = [...new Set(M.map(m => m.year).filter(Boolean))].sort((a, b) => b - a).slice(0, 6);
  LANGS = [...new Set(M.flatMap(m => (m.language || '').split(/[•,\/]/).map(x => x.trim()).filter(Boolean)))].slice(0, 6);
  TREND = [...M].sort((a, b) => (b.rating || 0) - (a.rating || 0)).slice(0, 4).map(m => m.name)
    .concat(GENRES.slice(1, 5));
}
const tokens = () => words(S.q);
function hl(text) {
  let h = esc(text);
  const t = tokens().filter(x => x.length > 0).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!t.length) return h;
  try { h = h.replace(new RegExp('(' + t.join('|') + ')', 'gi'), '<mark>$1</mark>'); } catch (e) {}
  return h;
}
function scoreMovie(m, toks) {
  let total = 0; const why = [];
  for (const t of toks) {
    let s = 0, w = '';
    if (m._t.startsWith(t)) s = 100; else if (m._tw.some(x => x.startsWith(t))) s = 70; else if (m._t.includes(t)) s = 45;
    if (s < 100) {
      const c = m._cast.find(c => c.w.some(x => x.startsWith(t)) || c.l.includes(t));
      if (c && s < 55) { s = 55; w = 'Cast: ' + c.n; }
      const gi = m._g.findIndex(g => g.startsWith(t));
      if (gi > -1 && s < 40) { s = 40; w = 'Genre: ' + m.genres[gi]; }
      if (TYPEW[t] && TYPEW[t] === m.type && s < 25) { s = 25; w = m.type === 'series' ? 'Series' : 'Movie'; }
      if (String(m.y || m.year) === t && s < 30) { s = 30; w = 'Year ' + m.year; }
      if (m._lang.includes(t) && s < 12) { s = 12; w = 'Language: ' + m.language; }
      if (!s && t.length >= 3 && norm(m.quality).includes(t)) { s = 20; w = 'Quality: ' + m.quality; }
      if (!s && t.length >= 4 && m._d.includes(t)) { s = 15; w = 'Found in description'; }
      if (!s && t.length >= 3) {
        const thr = t.length >= 6 ? 2 : 1; let best = 9;
        for (const v of m._v) best = Math.min(best, lev(t, v), lev(t, v.slice(0, t.length)));
        if (best <= thr) { s = 28 - best * 6; w = 'Similar match'; }
      }
    }
    if (!s) return null;
    total += s; if (w) why.push(w);
  }
  return {m, score: total + (m.rating || 0), why: why[0] || ''};
}
function passFilters(m) {
  if (S.type !== 'all' && m.type !== S.type) return false;
  if (S.genres.length && !S.genres.some(g => (m.genres || []).includes(g))) return false;
  if (S.rating && (m.rating || 0) < S.rating) return false;
  if (S.year !== 'any' && String(m.year) !== S.year) return false;
  if (S.lang !== 'any' && !(m.language || '').includes(S.lang)) return false;
  return true;
}
function runSearch() {
  const toks = tokens();
  let arr = M.filter(passFilters).map(m => toks.length ? scoreMovie(m, toks) : {m, score: m.rating || 0, why: ''}).filter(Boolean);
  const cmp = {
    rel: (a, b) => b.score - a.score,
    rating: (a, b) => (b.m.rating || 0) - (a.m.rating || 0),
    new: (a, b) => (b.m.created || 0) - (a.m.created || 0),
    az: (a, b) => a.m.name.localeCompare(b.m.name)
  }[S.sort];
  return arr.sort(cmp);
}
function didYouMean() {
  const toks = tokens(); if (!toks.length || !VOCAB.length) return null;
  let changed = false;
  const fixed = toks.map(t => {
    if (VOCAB.some(v => v.startsWith(t))) return t;
    let best = t, bd = 99;
    VOCAB.forEach(v => { const d = lev(t, v); if (d < bd) { bd = d; best = v; } });
    if (bd <= 2 && t.length > 2) { changed = true; return best; }
    return t;
  });
  return changed ? fixed.join(' ') : null;
}
function buildSug() {
  const q = norm(S.q.trim()); if (!q) return [];
  const out = [], seenS = new Set();
  const push = (text, kind, icon) => { const k = norm(text); if (seenS.has(k) || k === q) return; seenS.add(k); out.push({text, kind, icon}); };
  M.filter(m => m._t.includes(q) || m._tw.some(w => w.startsWith(q)))
    .sort((a, b) => (b._t.startsWith(q) - a._t.startsWith(q)) || (b.rating || 0) - (a.rating || 0)).slice(0, 4).forEach(m => push(m.name, 'Title', 'movies'));
  let n = 0;
  M.forEach(m => m._cast.forEach(c => { if (n < 2 && c.l.includes(q) && !seenS.has(c.l)) { push(c.n, 'Cast', 'user'); n++; } }));
  GENRES.filter(g => g !== 'All' && norm(g).startsWith(q)).forEach(g => push(g, 'Genre', 'sparkle'));
  if (!out.length && q.length >= 3) {
    M.map(m => ({m, d: Math.min(...m._tw.map(w => lev(q, w.slice(0, q.length))))})).filter(x => x.d <= 2).sort((a, b) => a.d - b.d).slice(0, 3)
      .forEach(x => push(x.m.name, 'Did you mean', 'movies'));
  }
  return out.slice(0, 6);
}
const filterCount = () => (S.type !== 'all') + S.genres.length + (S.rating > 0) + (S.year !== 'any') + (S.lang !== 'any');

function filtersHTML() {
  const ch = (f, v, label, on) => `<button class="chip sm ${on ? 'active' : ''}" data-act="f" data-f="${f}" data-v="${esc(v)}">${label}</button>`;

    <div class="fl"><b>Type</b><div>${[['all','All'],['movie','Movies'],['series','Series']].map(([v,l]) => ch('type', v, l, S.type === v)).join('')}</div></div>`;
  if (M.some(m => m.rating)) h += `<div class="fl"><b>Rating</b><div>${[[0,'Any'],[7,'7+ ★'],[8,'8+ ★'],[8.5,'8.5+ ★']].map(([v,l]) => ch('rating', v, l, S.rating === v)).join('')}</div></div>`;

  if (GENRES.length > 1) h += `<div class="fl"><b>Genres</b><div>${GENRES.slice(1).map(g => ch('genre', g, esc(g), S.genres.includes(g))).join('')}</div></div>`;

function buildSearchMounts() {

    <div class="sx-filters"><div class="sx-filters-in"><div class="sx-fbody"></div></div></div>

function renderSearchUI() {
  const fc = filterCount(), hasQ = !!S.q.trim(), searching = hasQ || fc > 0;
  $$('.sx-input').forEach(i => { if (i.value !== S.q) i.value = S.q; });
  $$('.sx-bar').forEach(b => b.classList.toggle('has-q', !!S.q));
  $$('.fbadge').forEach(b => { b.textContent = fc; b.style.display = fc ? 'grid' : 'none'; });
  $$('.sx-btn[data-act="filter"]').forEach(b => b.classList.toggle('on', S.filtersOpen));
  S.sugList = hasQ && S.sugOpen ? buildSug() : [];
  if (S.sel >= S.sugList.length) S.sel = -1;
  const res = searching ? runSearch() : [];
  const key = JSON.stringify([S.q, S.type, S.genres, S.rating, S.year, S.lang, S.sort, S.layout, res.map(r => r.m.id)]);
  const fHTML = filtersHTML(), aHTML = activeHTML(), sHTML = sugHTML();
  const headHTML = searching ? `<div class="text-sm font-semibold">${res.length} result${res.length === 1 ? '' : 's'}${hasQ ? ` for <span style="color:var(--accent)">“${esc(S.q.trim())}”</span>` : ''}</div>
      <div class="seg"><button data-act="layout" data-v="grid" class="${S.layout === 'grid' ? 'on' : ''}" aria-label="Grid view">${ico('grid', 16)}</button><button data-act="layout" data-v="list" class="${S.layout === 'list' ? 'on' : ''}" aria-label="List view">${ico('list', 16)}</button></div>` : '';
  $$('.sx').forEach(sx => {
    const q = s => sx.querySelector(s);
    q('.sx-filters').classList.toggle('open', S.filtersOpen);
    q('.sx-fbody').innerHTML = fHTML;
    q('.sx-active').innerHTML = aHTML;
    q('.sug').innerHTML = sHTML;
    q('.sx-head').innerHTML = headHTML;
    q('.sx-head').style.display = searching ? '' : 'none';
    const idle = q('.sx-idle');
    const ik = S.recent.join('|') + '#' + M.length;
    if (!searching) { if (idle.dataset.k !== ik) { idle.innerHTML = idleHTML(); idle.dataset.k = ik; } idle.style.display = ''; }
    else idle.style.display = 'none';
    const r = q('.sx-res');
    if (searching) { if (r.dataset.key !== key) { r.innerHTML = resHTML(res); r.dataset.key = key; } }
    else { r.innerHTML = ''; r.dataset.key = ''; }
  });
}
let sTimer;
function scheduleSearch() { clearTimeout(sTimer); sTimer = setTimeout(renderSearchUI, 70); }
function setQuery(v, commit) {
  S.q = v; S.sel = -1; S.sugOpen = !commit;
  if (commit) { saveRecent(v); renderSearchUI(); } else scheduleSearch();
  $$('.sx-input').forEach(i => { if (i.value !== v) i.value = v; });
  $$('.sx-bar').forEach(b => b.classList.toggle('has-q', !!v));
}
function saveRecent(q) {
  q = q.trim(); if (q.length < 2) return;
  S.recent = [q, ...S.recent.filter(r => r.toLowerCase() !== q.toLowerCase())].slice(0, 8);
  localStorage.setItem('fo_recent', JSON.stringify(S.recent));
  $$('.sx-idle').forEach(i => i.dataset.k = '');
}
function pickResult(id) {
  if (S.q.trim()) saveRecent(S.q);
  if (shOpen) closeSearch();
  openModal(id);
}
function applySug(i) {
  const s = S.sugList[i]; if (!s) return;
  if (s.kind === 'Genre') { if (!S.genres.includes(s.text)) S.genres.push(s.text); setQuery('', true); }
  else setQuery(s.text, true);
}
function voiceSearch() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Voice search is not supported here'); return; }
  try {
    const r = new SR(); r.lang = 'en-IN'; r.interimResults = true;
    $$('[data-act="mic"]').forEach(b => b.classList.add('listening'));
    toast('Listening… speak now');
    r.onresult = e => setQuery([...e.results].map(x => x[0].transcript).join(''), e.results[e.results.length - 1].isFinal);
    r.onerror = () => toast('Could not hear you, try again');
    r.onend = () => $$('[data-act="mic"]').forEach(b => b.classList.remove('listening'));
    r.start();
  } catch (e) { toast('Voice search unavailable'); }
}

/* ---------- delegated actions ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  const focusIn = () => { const i = (shOpen ? $('#shInput') : $('#scInput')); i && i.focus({preventScroll: true}); };
  switch (a) {
    case 'clear': setQuery('', false); S.sugOpen = true; renderSearchUI(); focusIn(); break;
    case 'mic': voiceSearch(); break;
    case 'filter': S.filtersOpen = !S.filtersOpen; hap('select'); renderSearchUI(); break;
    case 'close': closeSearch(); break;
    case 'recent': setQuery(v, true); break;
    case 'dym': setQuery(v, true); break;
    case 'rmRecent': S.recent.splice(+b.dataset.i, 1); localStorage.setItem('fo_recent', JSON.stringify(S.recent)); $$('.sx-idle').forEach(i => i.dataset.k = ''); renderSearchUI(); break;
    case 'clearRecent': S.recent = []; localStorage.removeItem('fo_recent'); $$('.sx-idle').forEach(i => i.dataset.k = ''); renderSearchUI(); break;
    case 'genre': S.genres = [v]; S.sugOpen = false; hap('select'); renderSearchUI(); break;
    case 'sug': applySug(+b.dataset.i); break;
    case 'layout': S.layout = v; hap('select'); renderSearchUI(); break;
    case 'resetf': S.type = 'all'; S.genres = []; S.rating = 0; S.year = 'any'; S.lang = 'any'; renderSearchUI(); break;
    case 'rmf': {
      const k = b.dataset.k;
      if (k === 'type') S.type = 'all'; else if (k === 'genre') S.genres = S.genres.filter(g => g !== v);
      else if (k === 'rating') S.rating = 0; else if (k === 'year') S.year = 'any'; else if (k === 'lang') S.lang = 'any';
      renderSearchUI(); break;
    }
    case 'f': {
      const f = b.dataset.f;
      hap('select');
      if (f === 'genre') S.genres = S.genres.includes(v) ? S.genres.filter(g => g !== v) : [...S.genres, v];
      else if (f === 'rating') S.rating = +v;
      else S[f] = v;
      renderSearchUI(); break;
    }
    case 'atype': A.type = v; hap('select'); paintAdminForm(); break;
    case 'more': A.moreOpen = !A.moreOpen; hap('select'); paintAdminForm(); break;
    case 'asave': adminSave(); break;
    case 'acancel': adminReset(); break;
    case 'aedit': adminEdit(v); break;
    case 'adel': adminDelete(v); break;
    case 'apost': adminRepost(v); break;
    case 'arefresh': hap('light'); renderAdmin(true); break;
  }
});
$$('.sx-input').forEach(inp => {
  inp.addEventListener('input', e => { S.sugOpen = true; setQuery(e.target.value, false); });
  inp.addEventListener('focus', () => { if (S.q && !S.sugOpen) { S.sugOpen = true; renderSearchUI(); } });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!S.sugList.length) return; e.preventDefault();
      const n = S.sugList.length;
      S.sel = e.key === 'ArrowDown' ? (S.sel + 1) % n : (S.sel - 1 + n) % n;
      renderSearchUI();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (S.sel >= 0) applySug(S.sel); else setQuery(S.q, true);
      if (matchMedia('(pointer:coarse)').matches) inp.blur();
    }
  });
});

/* =====================================================================
   ADMIN PANEL
   ===================================================================== */
const A = { status: null, movies: [], editing: null, moreOpen: false, type: 'movie', q: '', busy: false, loaded: false };
const AF = ['name','link','size','quality','poster','backdrop','genres','year','rating','duration','language','age','cast','description'];

      <div class="aprev ${m && m.poster ? 'show' : ''}" id="a_prev"><div class="ph">${ico('movies', 22)}</div><img id="a_previmg" ${m && m.poster ? `src="${esc(m.poster)}"` : ''} onerror="this.style.display='none'"></div>
    </div>
    <button class="more-toggle" data-act="more">${ico(A.moreOpen ? 'chevUp' : 'chevD', 15)} ${A.moreOpen ? 'Hide' : 'More'} details (genre, rating, cast…)</button>
    <div class="more-body ${A.moreOpen ? 'open' : ''}"><div class="more-in">
      <div class="fld"><label>Backdrop URL (wide image)</label><input id="a_backdrop" value="${val('backdrop')}" placeholder="https://…jpg"></div>
      <div class="fld"><label>Genres (comma separated)</label><input id="a_genres" value="${val('genres')}" placeholder="Action, Thriller"></div>
      <div class="f3">
        <div class="fld"><label>Year</label><input id="a_year" value="${val('year')}" placeholder="2025" inputmode="numeric"></div>
        <div class="fld"><label>Rating</label><input id="a_rating" value="${val('rating')}" placeholder="8.4" inputmode="decimal"></div>
        <div class="fld"><label>Age</label><input id="a_age" value="${val('age')}" placeholder="U/A 16+"></div>
      </div>

        <div class="fld"><label>Duration</label><input id="a_duration" value="${val('duration')}" placeholder="2h 18m"></div>
        <div class="fld"><label>Language</label><input id="a_language" value="${val('language')}" placeholder="Hindi • English"></div>
      </div>
      <div class="fld"><label>Cast (comma separated)</label><input id="a_cast" value="${val('cast')}" placeholder="Actor One, Actor Two"></div>
      <div class="fld"><label>Description</label><textarea id="a_description" placeholder="Short plot / details…">${val('description')}</textarea></div>
    </div></div>
    <label class="chk"><input type="checkbox" id="a_post" ${A.editing ? '' : 'checked'}> Channel par post karo</label>
    <button class="btn-primary w-full py-3.5 flex items-center justify-center gap-2" data-act="asave" ${A.busy ? 'disabled' : ''}>${ico(A.editing ? 'save' : 'plus', 18)} ${A.busy ? 'Saving…' : (A.editing ? 'Update Title' : 'Add Title')}</button>
    ${A.editing ? `<button class="btn-ghost dark w-full mt-2 py-3 flex items-center justify-center gap-2" data-act="acancel">${ico('x', 16)} Cancel edit</button>` : ''}
  </div>`;
}
function adminListHTML() {
  const q = A.q.toLowerCase().trim();
  const items = A.movies.filter(m => !q || (m.name || '').toLowerCase().includes(q));
  if (!items.length) return `<div class="empty-s"><div class="em">${ico('movies', 36)}</div><p class="font-semibold">Koi title nahi</p></div>`;
  return items.map((m, i) => `
    <div class="arow" style="--i:${Math.min(i, 14)}">
      <div class="thumb">${m.poster ? `<img src="${esc(m.poster)}" loading="lazy" onerror="this.style.display='none'">` : `<div class="ph">${ico('movies', 20)}</div>`}</div>

        <div class="font-semibold text-sm truncate">${esc(m.name)}</div>

        <div class="text-[10px] mt-0.5 truncate" style="color:var(--muted);opacity:.7">${esc(m.link)}</div>

function paintAdminForm() {
  const box = $('#aFormBox'); if (box) { box.innerHTML = adminFormHTML(); bindAdminForm(); }
}
function bindAdminForm() {
  const p = $('#a_poster'), prev = $('#a_prev'), pimg = $('#a_previmg');
  if (!p) return;
  const upd = () => {
    const u = p.value.trim();
    if (!u) { prev.classList.remove('show'); pimg.removeAttribute('src'); return; }
    prev.classList.add('show'); pimg.style.display = ''; pimg.src = u;
  };
  p.addEventListener('change', upd); p.addEventListener('blur', upd);
}
function renderAdmin(force) {
  if (!IS_ADMIN) return;
  if (!A.loaded || force) {
    $('#adminBody').innerHTML = `<div class="apanel glass"><div class="acc-t"><span class="acc-ico">${ico('refresh', 19)}</span> Loading <span class="dots-load ml-auto"><i></i><i></i><i></i></span></div></div>`;
    Promise.all([api('/api/admin/status'), api('/api/admin/movies')]).then(([st, ls]) => {
      A.status = st; A.movies = ls.movies || []; A.loaded = true; paintAdmin();
    }).catch(e => {
      $('#adminBody').innerHTML = `<div class="aalert warn">${ico('info', 18)}<div>${esc(e.message)}</div></div>
        <button class="btn-primary w-full py-3" data-act="arefresh">Retry</button>`;
    });
    return;
  }
  paintAdmin();
}
function paintAdmin() {
  const st = A.status || {};
  const okStore = st.storage && st.storage.ok;
  $('#adminBody').innerHTML = `
    ${okStore
      ? `<div class="aalert ok">${ico('check', 18)}<div>Database channel mein pinned hai — restart safe.</div></div>`
      : `<div class="aalert warn">${ico('info', 18)}<div>${esc((st.storage && st.storage.error) || 'Storage problem')}<br>Bot ko private channel mein <b>Pin Messages</b> right dein.</div></div>`}
    <div class="astat">
      <div class="glass" style="--i:0"><div class="v">${st.titles || 0}</div><div class="k">Titles</div></div>
      <div class="glass" style="--i:1"><div class="v">${st.movies_count || 0}</div><div class="k">Movies</div></div>
      <div class="glass" style="--i:2"><div class="v">${st.series_count || 0}</div><div class="k">Series</div></div>
    </div>
    <div id="aFormBox">${adminFormHTML()}</div>
    <div class="apanel glass">
      <h3>${ico('list', 19)} Library (${A.movies.length}) <button class="lnk" data-act="arefresh">${ico('refresh', 14)}</button></h3>
      <div class="fld"><input id="a_q" value="${esc(A.q)}" placeholder="Filter by name…"></div>
      <div id="aListBox">${adminListHTML()}</div>
    </div>`;
  bindAdminForm();
  const aq = $('#a_q');
  if (aq) aq.addEventListener('input', e => {
    A.q = e.target.value;
    clearTimeout(window._aqt);
    window._aqt = setTimeout(() => { const b = $('#aListBox'); if (b) b.innerHTML = adminListHTML(); }, 130);
  });
}
function adminReset() { A.editing = null; A.type = 'movie'; A.moreOpen = false; hap('light'); paintAdminForm(); }
function adminEdit(id) {
  const m = A.movies.find(x => x.id === id); if (!m) return;
  A.editing = id; A.type = m.type || 'movie'; A.moreOpen = true; hap('select');
  paintAdminForm();
  $('#aFormBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function adminSave() {
  if (A.busy) return;
  const body = { type: A.type, post: $('#a_post') ? $('#a_post').checked : false };
  AF.forEach(k => { const el = $('#a_' + k); if (el) body[k] = el.value.trim(); });
  if (!body.name) { toast('Name daalein'); hap('err'); return; }
  if (!/^https?:\/\//.test(body.link || '') && !/^tg:\/\//.test(body.link || '')) { toast('Link https:// se shuru ho'); hap('err'); return; }
  A.busy = true; paintAdminForm();
  const p = A.editing ? api('/api/admin/update', { id: A.editing, ...body }) : api('/api/admin/add', body);
  p.then(d => {
    hap('ok'); toast(A.editing ? 'Title updated' : 'Title added');
    if (d.warnings && d.warnings.length) setTimeout(() => toast('⚠ ' + d.warnings[0]), 2500);
    A.editing = null; A.moreOpen = false; A.type = 'movie';
    return Promise.all([api('/api/admin/status'), api('/api/admin/movies')]);
  }).then(([st, ls]) => {
    A.status = st; A.movies = ls.movies || []; A.busy = false; paintAdmin();
    return loadCatalog(true);
  }).catch(e => { A.busy = false; hap('err'); toast(e.message); paintAdminForm(); });
}
function adminDelete(id) {
  const m = A.movies.find(x => x.id === id); if (!m) return;
  const go = () => {
    api('/api/admin/delete', { id }).then(() => {
      hap('ok'); toast('Deleted');
      return Promise.all([api('/api/admin/status'), api('/api/admin/movies')]);
    }).then(([st, ls]) => {
      A.status = st; A.movies = ls.movies || [];
      if (A.editing === id) { A.editing = null; }
      paintAdmin(); return loadCatalog(true);
    }).catch(e => { hap('err'); toast(e.message); });
  };
  if (tg && tg.showConfirm) tg.showConfirm(`Delete "${m.name}"?`, ok => { if (ok) go(); });
  else if (confirm(`Delete "${m.name}"?`)) go();
}
function adminRepost(id) {
  hap('light');
  api('/api/admin/repost', { id }).then(() => { hap('ok'); toast('Channel par post ho gaya'); })
    .catch(e => { hap('err'); toast(e.message); });
}

/* ---------- EXPANDING TOP SEARCH BAR ---------- */
const sh = $('#sh'), slot = $('#sbSlot');
let shOpen = false, shT1, shT2;
function placeShell(instant) {
  if (shOpen) return layoutOpen();
  if (instant) sh.classList.add('nt');
  const r = slot.getBoundingClientRect();
  sh.style.left = r.left + 'px'; sh.style.top = r.top + 'px'; sh.style.width = r.width + 'px';
  if (instant) requestAnimationFrame(() => requestAnimationFrame(() => sh.classList.remove('nt')));
}
function layoutOpen() {
  const vw = document.documentElement.clientWidth, w = Math.min(vw - 20, 920);
  sh.style.left = ((vw - w) / 2) + 'px';
  sh.style.top = (10 + (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0)) + 'px';
  sh.style.width = w + 'px';
}
function openSearch() {
  if (shOpen) return;
  shOpen = true; clearTimeout(shT2); hap('light');
  document.body.classList.add('sopen');
  sh.classList.add('open'); $('#scrim').classList.add('on');
  $('#shInput').placeholder = 'Search movies, series, cast…';
  layoutOpen();
  $('#shInput').focus({preventScroll: true});
  S.sugOpen = true; renderSearchUI();
  document.body.style.overflow = 'hidden';
  shT1 = setTimeout(() => sh.classList.add('expanded'), 380);
  syncBack();
}
function closeSearch() {
  if (!shOpen) return;
  shOpen = false; clearTimeout(shT1);
  sh.classList.remove('expanded');
  $('#shInput').blur(); $('#scrim').classList.remove('on');
  if (!currentModal) document.body.style.overflow = '';
  shT2 = setTimeout(() => {
    sh.classList.remove('open'); document.body.classList.remove('sopen');
    $('#shInput').placeholder = 'Search'; placeShell();
  }, 420);
  placeShell(); syncBack();
}
sh.addEventListener('click', e => { if (!shOpen && !e.target.closest('[data-act]')) openSearch(); });
$('#scrim').addEventListener('click', closeSearch);
addEventListener('resize', () => placeShell(true));
if ('ResizeObserver' in window) new ResizeObserver(() => { if (!shOpen) placeShell(true); }).observe(slot);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (currentModal) closeModal();
    else if (shOpen) closeSearch();
  }
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if ((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')) { e.preventDefault(); openSearch(); }
});

/* ---------- DATA LOAD ---------- */
function paintBrand() {
  const b = BRAND || 'FlixOrange';
  const parts = b.replace(/^[^\w]+/, '').trim().split(/\s+/);
  const html = parts.length > 1
    ? esc(parts[0]) + '<span style="color:var(--accent)">' + esc(parts.slice(1).join(' ')) + '</span>'
    : esc(b.replace(/^[^\w]+/, '').trim() || 'Library');
  $('#navBrand').innerHTML = html;
  $('#footBrand').innerHTML = html;
  $('#bootBrand').textContent = b.replace(/^[^\w]+/, '').trim() || 'Library';
  document.title = b.replace(/^[^\w]+/, '').trim() || 'Library';
}
function loadCatalog(silent) {
  return fetch('/api/movies', { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      M = d.movies || [];
      BRAND = d.brand || BRAND;
      BOTUSER = d.bot || '';
      GENRES = ['All', ...(d.genres || [])];
      const ranked = [...M].sort((a, b) => (b.rating || 0) - (a.rating || 0) || (b.created || 0) - (a.created || 0));
      HERO = ranked.filter(m => big(m)).slice(0, 5).map(m => m.id);
      if (!HERO.length) HERO = ranked.slice(0, 3).map(m => m.id);
      buildIndex(); paintBrand(); buildHero();
      $$('.sx-idle').forEach(i => i.dataset.k = '');
      render();
      if (!silent) { $('#boot').classList.add('gone'); setTimeout(() => { const b = $('#boot'); if (b) b.remove(); }, 700); }
    });
}
function bootFail(msg) {
  $('#bootMsg').innerHTML = `${esc(msg)}<br><button class="btn-primary mt-4 px-6 py-2.5 text-sm" onclick="location.reload()">Retry</button>`;
}

/* ---------- INIT ---------- */
hydrateIcons();
applyTheme(localStorage.getItem('fo_theme') || (tg && tg.colorScheme === 'light' ? 'light' : 'dark'));
buildSearchMounts();
paintBrand();
placeShell(true);
setTimeout(() => placeShell(true), 300);

(function boot() {
  const sess = INIT ? api('/api/session') : Promise.resolve({ is_admin: false });
  sess.then(s => {
    IS_ADMIN = !!s.is_admin;
    USER = s.user || null;
    $('#dkAdmin').classList.toggle('hidden', !IS_ADMIN);
    if (USER) {
      const av = $('#avatar');
      if (USER.photo) av.innerHTML = `<img src="${esc(USER.photo)}" class="w-full h-full object-cover" alt="">`;
      else av.textContent = (USER.name || 'U').charAt(0).toUpperCase();
    }
  }).catch(() => { IS_ADMIN = false; })
    .then(() => loadCatalog(false))
    .catch(e => bootFail(e.message || 'Server se connect nahi ho paya'));
})();
</script>
