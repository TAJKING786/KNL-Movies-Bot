<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0d">
<title>KNL Movies</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://image.tmdb.org">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--spring:cubic-bezier(.34,1.56,.64,1);--smooth:cubic-bezier(.22,1,.36,1);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
:root,[data-theme="dark"]{--bg:#0b0b0d;--surface:#17171b;--surface2:#222228;--text:#f5f5f5;--muted:#a8a8b3;--border:rgba(255,255,255,.1);--nav:rgba(14,14,17,.55);--accent:#ff7a00;--accent2:#ffa040;--shadow:0 20px 50px rgba(0,0,0,.6);--ga:rgba(255,255,255,.13);--gb:rgba(255,255,255,.035);--gborder:rgba(255,255,255,.17);--ghi:rgba(255,255,255,.34);--glo:rgba(255,255,255,.07);--gshadow:0 14px 40px rgba(0,0,0,.5);--gring:rgba(255,255,255,0);--sheen:rgba(255,255,255,.16);--chipbg:rgba(255,255,255,.1);--blob:.22;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--info:#38bdf8}
[data-theme="light"]{--bg:#fff;--surface:#fff4e8;--surface2:#ffe6cc;--text:#1b1209;--muted:#7d6c5a;--border:rgba(255,122,0,.22);--nav:rgba(255,255,255,.6);--accent:#ff6a00;--accent2:#ff9440;--shadow:0 20px 45px rgba(255,106,0,.22);--ga:rgba(255,255,255,.85);--gb:rgba(255,238,220,.5);--gborder:rgba(255,255,255,.95);--ghi:#fff;--glo:rgba(255,122,0,.16);--gshadow:0 14px 38px rgba(255,106,0,.2);--gring:rgba(255,122,0,.14);--sheen:rgba(255,255,255,.9);--chipbg:rgba(255,122,0,.1);--blob:.3}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
*{-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);transition:background .5s var(--smooth),color .4s;overflow-x:hidden;touch-action:manipulation}
img{border:0;max-width:100%}a{color:inherit;text-decoration:none}h1,h2,h3,h4,p{margin:0}button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--surface);border-radius:9px}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--accent),var(--accent2));border-radius:9px;border:2px solid var(--surface)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
*{scrollbar-width:thin;scrollbar-color:var(--accent) var(--surface)}
.display{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.04em}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
.ic{display:block;flex-shrink:0}
main,footer{position:relative;z-index:1}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:var(--blob);z-index:0;pointer-events:none;background:radial-gradient(circle,var(--accent),transparent 70%);will-change:transform;transform:translateZ(0);contain:strict}
.b1{width:420px;height:420px;top:8%;left:-120px;animation:float1 16s ease-in-out infinite}
.b2{width:360px;height:360px;top:45%;right:-100px;animation:float2 19s ease-in-out infinite}
.b3{width:460px;height:460px;bottom:-160px;left:30%;animation:float1 22s ease-in-out infinite reverse}
.low .b3{display:none}
.low .b1,.low .b2{animation-duration:34s}
@keyframes float1{50%{transform:translate3d(90px,70px,0) scale(1.15)}}
@keyframes float2{50%{transform:translate3d(-80px,-90px,0) scale(.9)}}
.glass{background:radial-gradient(120% 90% at 12% 0%,var(--sheen),transparent 55%),linear-gradient(135deg,var(--ga),var(--gb));-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);border:1px solid var(--gborder);box-shadow:inset 0 1px 1px var(--ghi),inset 0 -10px 18px -12px var(--glo),0 0 0 1px var(--gring),var(--gshadow)}
.nav{background:var(--nav);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);border-bottom:1px solid var(--gborder);box-shadow:inset 0 -1px 0 var(--glo),0 8px 30px rgba(0,0,0,.12)}
.nav-item{transition:opacity .35s var(--smooth),transform .5s var(--spring)}
body.sopen .nav-item{opacity:0;transform:scale(.85);pointer-events:none}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;border-radius:999px;border:none;cursor:pointer;transition:transform .5s var(--spring),box-shadow .3s;box-shadow:0 10px 26px rgba(255,122,0,.4),inset 0 1px 1px rgba(255,255,255,.55)}
.btn-primary:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 16px 34px rgba(255,122,0,.55),inset 0 1px 1px rgba(255,255,255,.55)}
.btn-ghost{color:#fff;font-weight:600;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.08));-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 8px 22px rgba(0,0,0,.25);transition:transform .5s var(--spring),background .3s}
.btn-ghost:hover{transform:translateY(-3px) scale(1.06)}
.btn-ghost.dark{color:var(--text);background:var(--chipbg);border-color:var(--gborder);box-shadow:inset 0 1px 1px var(--ghi)}
.icon-btn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--text);cursor:pointer;transition:transform .5s var(--spring),background .3s,color .3s}
.icon-btn:hover{transform:scale(1.15) rotate(-6deg);color:var(--accent)}
button:active:not(:disabled){transform:scale(.88)!important}
button:disabled{opacity:.55;cursor:default}
.spin svg{animation:spinpop .8s var(--spring)}
@keyframes spinpop{from{transform:rotate(-200deg) scale(.3);opacity:0}}
.chip{padding:8px 18px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--chipbg);border:1px solid var(--gborder);color:var(--muted);cursor:pointer;transition:transform .45s var(--spring),background .3s,color .3s,box-shadow .3s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px var(--ghi)}
.chip:hover{color:var(--text);transform:translateY(-2px) scale(1.06)}
.chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(255,122,0,.4),inset 0 1px 1px rgba(255,255,255,.5);transform:scale(1.05)}
.chip.sm{padding:6px 14px;font-size:12px}
.hero{position:relative;height:86vh;max-height:700px;min-height:520px;overflow:hidden}
.hero-slide{position:absolute;top:0;right:0;bottom:0;left:0;opacity:0;transition:opacity 1s ease;pointer-events:none}
.hero-slide.active{opacity:1;pointer-events:auto}
.hero-slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.1);transition:transform 8s ease-out;will-change:transform}
.hero-slide.active img{transform:scale(1)}
.hero-shade{position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.55) 40%,rgba(0,0,0,.05) 80%),linear-gradient(0deg,var(--bg) 0%,transparent 35%)}
.hero-content>*{opacity:0;transform:translateY(30px) scale(.96)}
.hero-slide.active .hero-content>*{animation:rise .9s var(--spring) forwards}
.hero-slide.active .hero-content>*:nth-child(2){animation-delay:.1s}
.hero-slide.active .hero-content>*:nth-child(3){animation-delay:.2s}
.hero-slide.active .hero-content>*:nth-child(4){animation-delay:.3s}
.hero-slide.active .hero-content>*:nth-child(5){animation-delay:.4s}
@keyframes rise{to{opacity:1;transform:none}}
.dot{height:7px;width:7px;border-radius:7px;background:rgba(255,255,255,.45);cursor:pointer;transition:all .6s var(--spring)}
.dot.active{width:44px;background:var(--accent);box-shadow:0 0 14px rgba(255,122,0,.8)}
.row-wrap{position:relative}
.row-scroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:16px 6px 26px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.row-arrow{position:absolute;top:50%;transform:translateY(-60%);z-index:20;width:46px;height:46px;border-radius:999px;color:var(--text);display:none;place-items:center;opacity:0;transition:opacity .3s,transform .5s var(--spring);cursor:pointer}
.row-wrap:hover .row-arrow{opacity:1}
.row-arrow:hover{transform:translateY(-60%) scale(1.18)!important;color:var(--accent)}
.row-arrow.l{left:-10px}.row-arrow.r{right:-10px}
@media(min-width:768px){.row-arrow{display:grid}}
.reveal{opacity:0;transform:translateY(36px) scale(.97);transition:opacity .7s var(--smooth),transform .95s var(--spring);content-visibility:auto;contain-intrinsic-size:auto 330px}
.reveal.in{opacity:1;transform:none}
.reveal.in .card,.stag .card,.stag .lrow{animation:bubble .75s var(--spring) backwards;animation-delay:calc(var(--i,0)*55ms + 100ms)}
.stag .card,.stag .lrow{animation-delay:calc(var(--i,0)*35ms);animation-duration:.6s}
@keyframes bubble{from{opacity:0;transform:translateY(26px) scale(.78)}}
.view-in{animation:viewin .7s var(--spring)}
@keyframes viewin{from{opacity:0;transform:translateY(24px) scale(.985)}}
.card{position:relative;flex:0 0 auto;width:160px;aspect-ratio:2/3;border-radius:18px;overflow:hidden;cursor:pointer;scroll-snap-align:start;background:var(--surface2);transition:transform .55s var(--spring),box-shadow .4s,outline-color .3s;outline:2px solid transparent;box-shadow:0 6px 18px rgba(0,0,0,.25);contain:layout paint}
.card.wide{width:280px;aspect-ratio:16/9}
@media(min-width:768px){.card{width:190px}.card.wide{width:320px}}
.card:hover{transform:scale(1.09) translateY(-6px);box-shadow:var(--shadow);z-index:10;outline-color:var(--accent)}
@supports selector(:has(*)){.card:active:not(:has(button:active)){transform:scale(.95)}}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--smooth)}
.card:hover img{transform:scale(1.08)}
.card .ph{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;font-size:40px;background:linear-gradient(150deg,var(--surface2),var(--surface));color:var(--muted)}
.card .info{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;background:linear-gradient(0deg,rgba(0,0,0,.92) 0%,rgba(0,0,0,.2) 55%,transparent 100%);color:#fff}
.card .hover-only{max-height:0;opacity:0;overflow:hidden;transition:all .45s var(--spring)}
.card:hover .hover-only{max-height:60px;opacity:1;margin-top:6px}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent);color:#fff;letter-spacing:.04em}
.badge-o{border:1px solid rgba(255,255,255,.5);background:transparent}
.heart{position:absolute;top:9px;right:9px;width:32px;height:32px;border-radius:999px;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(10px) saturate(180%);backdrop-filter:blur(10px) saturate(180%);border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 1px rgba(255,255,255,.35);display:grid;place-items:center;color:#fff;z-index:5;cursor:pointer;transition:transform .5s var(--spring),background .3s}
.heart:hover{background:var(--accent);transform:scale(1.2) rotate(8deg)}
[data-heart].on{background:var(--accent)!important;color:#fff}
[data-heart].pop svg{animation:heartpop .6s var(--spring)}
@keyframes heartpop{0%{transform:scale(.2) rotate(-40deg)}60%{transform:scale(1.5) rotate(10deg)}100%{transform:none}}
.top-item{position:relative;flex:0 0 auto;display:flex;align-items:flex-end;scroll-snap-align:start}
.top-num{font-family:'Bebas Neue',Impact,sans-serif;font-size:150px;line-height:.8;margin-right:-26px;margin-bottom:4px;color:transparent;-webkit-text-stroke:3px var(--accent);z-index:1;user-select:none;filter:drop-shadow(0 0 14px rgba(255,122,0,.35))}
.top-item .card{z-index:2}
@media(max-width:640px){.top-num{font-size:110px;margin-right:-20px}}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.grid-cards .card{width:100%}
@media(min-width:768px){.grid-cards{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;background:rgba(0,0,0,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4vh 12px}
.overlay.open{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:860px;background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);animation:pop .6s var(--spring)}
.modal.flip{animation:none}
@keyframes pop{from{transform:translateY(60px) scale(.88);opacity:0}}
.modal-hero{position:relative;height:430px;overflow:hidden}
.modal-hero .bgimg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;filter:blur(24px) brightness(.4) saturate(1.3);transform:scale(1.25)}
.modal-hero::after{content:'';position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(0deg,var(--bg) 2%,rgba(11,11,13,.25) 45%,rgba(11,11,13,.5) 100%)}
.dposter-wrap{position:absolute;left:50%;top:52px;transform:translateX(-50%);z-index:3;width:172px;aspect-ratio:2/3;border-radius:20px;overflow:hidden;background:var(--surface2);box-shadow:0 24px 60px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.14)}
.dposter-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.dposter-wrap .ph{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;color:var(--muted);font-size:44px;background:linear-gradient(150deg,var(--surface2),var(--surface))}
.dhero-title{position:absolute;left:20px;right:20px;bottom:18px;z-index:3;text-align:center}
.flip-clone{position:fixed;z-index:250;border-radius:18px;overflow:hidden;pointer-events:none;will-change:transform;transform-origin:top left;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.flip-clone img{width:100%;height:100%;object-fit:cover;display:block}
.flip-clone .ph{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;color:var(--muted);background:linear-gradient(150deg,var(--surface2),var(--surface))}
.mini{border-radius:20px;overflow:hidden;cursor:pointer;background:var(--surface);border:1px solid var(--border);transition:transform .5s var(--spring),box-shadow .3s}
.mini:hover{transform:translateY(-6px) scale(1.04);box-shadow:var(--shadow)}
.mini .ph{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;color:var(--muted);background:var(--surface2)}
.acc{border-radius:24px;padding:18px;background:var(--chipbg);border:1px solid var(--gborder);box-shadow:inset 0 1px 1px var(--ghi);animation:bubble .6s var(--spring)}
.acc-t{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;margin-bottom:6px}
.acc-p{font-size:13px;color:var(--muted);line-height:1.6}
.acc-ico{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:inset 0 1px 1px rgba(255,255,255,.5);flex-shrink:0}
.acc-ico.ok{background:linear-gradient(135deg,#16a34a,#4ade80)}
.acc-ico.lock{background:linear-gradient(135deg,#6b7280,#9ca3af)}
.dots-load{display:inline-flex;gap:5px;align-items:center}
.dots-load i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bounce 1s infinite}
.dots-load i:nth-child(2){animation-delay:.15s}.dots-load i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-7px);opacity:1}}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,40px) scale(.7);color:var(--text);padding:11px 22px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .55s var(--spring);z-index:300;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.dock{position:fixed;left:50%;bottom:calc(14px + var(--sab));transform:translateX(-50%);z-index:50;display:flex;gap:4px;padding:7px;border-radius:999px;max-width:calc(100vw - 16px);animation:dockin 1s var(--spring) .4s backwards}
@keyframes dockin{from{transform:translate(-50%,140px) scale(.7);opacity:0}}
.dk{position:relative;display:flex;align-items:center;justify-content:center;height:46px;min-width:46px;padding:0 12px;border-radius:999px;color:var(--muted);border:none;background:transparent;cursor:pointer;transition:background .45s var(--smooth),color .3s,padding .55s var(--spring),transform .45s var(--spring),box-shadow .4s}
.dk:hover{color:var(--text);transform:translateY(-4px) scale(1.1)}
.dk-l{display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-size:12.5px;font-weight:600;margin-left:0;transition:max-width .6s var(--spring),opacity .3s,margin .6s var(--spring)}
.dk.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px rgba(255,122,0,.5),inset 0 1px 1px rgba(255,255,255,.6)}
.dk.active .dk-l{max-width:72px;opacity:1;margin-left:7px}
.dk.active svg{animation:ibounce .7s var(--spring)}
@keyframes ibounce{0%{transform:scale(.5) rotate(-18deg)}55%{transform:scale(1.35) rotate(8deg)}100%{transform:none}}
.dk-badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:none;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.dk.active .dk-badge{background:#fff;color:var(--accent)}
.dk-badge.bump{animation:heartpop .6s var(--spring)}
.sec-title{font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px}
.sec-title::before{content:'';width:5px;height:22px;border-radius:5px;background:linear-gradient(var(--accent2),var(--accent))}
::selection{background:var(--accent);color:#fff}
mark{background:rgba(255,122,0,.3);color:inherit;border-radius:5px;padding:0 2px}
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .5s var(--smooth)}
.scrim.on{opacity:1;pointer-events:auto}
.sh{position:fixed;z-index:70;overflow:hidden;border-radius:22px;cursor:pointer;transition:left .75s var(--spring),top .75s var(--spring),width .75s var(--spring),border-radius .6s var(--smooth),box-shadow .5s,transform .45s var(--spring)}
.sh.nt{transition:none!important}
.sh:not(.open):hover{transform:scale(1.05)}
.sh.open{border-radius:28px;cursor:default;box-shadow:inset 0 1px 1px var(--ghi),0 0 0 1px var(--gring),0 30px 80px rgba(0,0,0,.5),0 0 0 4px rgba(255,122,0,.18)}
.sh-bar,.sc-bar .sx-bar{display:flex;align-items:center;gap:8px}
.sh-bar{height:42px;padding:0 6px 0 14px}
.sh.open .sh-bar{height:52px;padding:0 8px 0 18px;transition:height .5s var(--spring)}
.sh:not(.open) .sx-input{pointer-events:none}
.sx-input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:16px;font-family:inherit;font-weight:500;text-overflow:ellipsis}
.sh:not(.open) .sx-input{font-size:14px}
.sx-input::placeholder{color:var(--muted);opacity:1}
.sx-input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.sh-ctl{display:flex;align-items:center;gap:6px;max-width:0;opacity:0;overflow:hidden;transition:max-width .7s var(--spring),opacity .4s}
.sh.open .sh-ctl{max-width:220px;opacity:1;overflow:visible}
.sx-btn{position:relative;width:36px;height:36px;flex-shrink:0;border-radius:999px;display:grid;place-items:center;background:var(--chipbg);color:var(--text);border:none;cursor:pointer;box-shadow:inset 0 1px 1px var(--ghi);transition:transform .5s var(--spring),background .3s,color .3s}
.sx-btn:hover{transform:scale(1.14) rotate(-5deg);color:var(--accent)}
.sx-btn.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.sx-btn.listening{background:var(--accent);color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,122,0,.6)}100%{box-shadow:0 0 0 14px rgba(255,122,0,0)}}
.sx-bar:not(.has-q) [data-act="clear"]{display:none}
.sx-bar.has-q [data-act="mic"]{display:none}
.fbadge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:#ff3b30;color:#fff;font-size:10px;font-weight:700;display:none;place-items:center;box-shadow:0 0 0 2px var(--bg)}

.sc-bar{border-radius:999px;padding:6px 8px 6px 20px;transition:box-shadow .4s,transform .5s var(--spring)}
.sc-bar:focus-within{box-shadow:inset 0 1px 1px var(--ghi),0 0 0 4px rgba(255,122,0,.25),var(--gshadow);transform:scale(1.015)}
.sc-bar .sx-bar{height:48px}
.sx-sec{margin-bottom:22px}
.sx-t{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.lnk{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);text-transform:none;letter-spacing:0;background:none;border:none;cursor:pointer}
.rchip{display:inline-flex;align-items:center;border-radius:999px;background:var(--chipbg);border:1px solid var(--gborder);box-shadow:inset 0 1px 1px var(--ghi);transition:transform .45s var(--spring);animation:bubble .55s var(--spring) backwards}

.rchip button{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--text);font-size:13px;padding:7px 8px 7px 13px;cursor:pointer}

.gtiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.gtiles{grid-template-columns:repeat(4,1fr)}}
.gtile{position:relative;height:78px;border-radius:20px;overflow:hidden;color:#fff;font-weight:700;font-size:15px;text-align:left;padding:0 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;border:1px solid rgba(255,255,255,.2);background-image:linear-gradient(120deg,var(--c) 8%,rgba(0,0,0,.3) 105%),var(--img);background-size:cover;background-position:center;box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 8px 18px rgba(0,0,0,.2);transition:transform .55s var(--spring);animation:bubble .6s var(--spring) backwards;animation-delay:calc(var(--i)*45ms)}
.gtile:hover{transform:scale(1.07) rotate(-1.5deg)}
.sug{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
.sg{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:16px;background:transparent;border:none;color:var(--text);text-align:left;cursor:pointer;font-size:14px;transition:background .25s,transform .45s var(--spring);animation:bubble .45s var(--spring) backwards;animation-delay:calc(var(--i)*40ms)}
.sg:hover,.sg.sel{background:var(--chipbg);transform:translateX(6px)}
.sg .gi{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.5);flex-shrink:0}
.sg small{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.sx-filters{display:grid;grid-template-rows:0fr;transition:grid-template-rows .65s var(--smooth),margin .5s}
.sx-filters.open{grid-template-rows:1fr;margin-bottom:14px}
.sx-filters-in{overflow:hidden;min-height:0}
.sx-fbody{padding:16px;border-radius:24px;background:var(--chipbg);border:1px solid var(--gborder);box-shadow:inset 0 1px 1px var(--ghi);opacity:0;transform:translateY(-12px) scale(.97);transition:opacity .4s,transform .6s var(--spring)}
.sx-filters.open .sx-fbody{opacity:1;transform:none}
.fl{margin-bottom:14px}.fl:last-child{margin-bottom:0}
.fl>b{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:7px}
.fl>div{display:flex;flex-wrap:wrap;gap:7px}
.apill{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 13px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;cursor:pointer;animation:bubble .5s var(--spring) backwards;box-shadow:0 6px 14px rgba(255,122,0,.3)}
.sx-active{display:flex;flex-wrap:wrap;gap:7px}
.sx-active:not(:empty){margin-bottom:14px}
.sx-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--chipbg);border:1px solid var(--gborder)}

.lrow{display:flex;gap:14px;padding:10px;border-radius:22px;cursor:pointer;align-items:center;background:var(--chipbg);border:1px solid var(--gborder);box-shadow:inset 0 1px 1px var(--ghi);margin-bottom:10px;transition:transform .55s var(--spring),border-color .3s;position:relative}

.phead{border-radius:28px;padding:24px 20px;text-align:center;position:relative;overflow:hidden;margin-bottom:16px}

.ptabs{display:flex;gap:8px;margin-bottom:14px}

.reqcta{display:flex;align-items:center;gap:13px;width:100%;padding:16px;border-radius:22px;border:1px dashed rgba(255,122,0,.5);background:linear-gradient(120deg,rgba(255,122,0,.12),rgba(255,160,64,.05));cursor:pointer;margin-bottom:16px;transition:transform .45s var(--spring);text-align:left;color:var(--text)}

.stchip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.04em}
.stchip.pending{background:rgba(245,158,11,.15);color:var(--warn);border:1px solid rgba(245,158,11,.35)}
.stchip.added{background:rgba(34,197,94,.15);color:var(--ok);border:1px solid rgba(34,197,94,.35)}
.stchip.rejected{background:rgba(239,68,68,.15);color:var(--bad);border:1px solid rgba(239,68,68,.35)}
/* ── request modal ── */
.req-modal{max-width:480px}
.req-body{padding:26px 22px 26px}

@keyframes ringpulse{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.25);opacity:0}}
.success-ring svg{animation:heartpop .7s var(--spring)}
.spark{position:absolute;width:8px;height:8px;border-radius:3px;background:var(--accent2);animation:sparkfly 1s var(--smooth) forwards}

.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.more-toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--accent);background:none;border:none;cursor:pointer;padding:4px 0 12px}

.more-in{overflow:hidden;min-height:0}
.chk{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;cursor:pointer;margin:6px 0 14px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.aprev{width:84px;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--surface2);margin-top:9px;position:relative;display:none;box-shadow:var(--shadow)}
.aprev.show{display:block;animation:bubble .5s var(--spring)}
.aprev img{width:100%;height:100%;object-fit:cover}
.aprev .ph{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;color:var(--muted)}
.arow{display:flex;gap:13px;padding:11px;border-radius:22px;align-items:center;background:var(--chipbg);border:1px solid var(--gborder);box-shadow:inset 0 1px 1px var(--ghi);margin-bottom:10px;transition:transform .55s var(--spring),border-color .3s;animation:bubble .55s var(--spring) backwards;animation-delay:calc(var(--i)*35ms)}
.arow:hover{transform:translateX(6px);border-color:var(--accent)}
.arow .thumb{width:56px;aspect-ratio:2/3;border-radius:13px;overflow:hidden;flex-shrink:0;position:relative;background:var(--surface2)}
.arow .thumb img{width:100%;height:100%;object-fit:cover}
.arow .ph{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;color:var(--muted)}
.abtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.abtns button{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;font-size:11.5px;font-weight:600;border-radius:999px;border:1px solid var(--gborder);background:var(--chipbg);color:var(--text);cursor:pointer;box-shadow:inset 0 1px 1px var(--ghi);transition:transform .45s var(--spring),color .3s}
.abtns button:hover{transform:scale(1.08);color:var(--accent)}
.abtns button.d:hover{color:#ff5a52}
.abtns button.g:hover{color:var(--ok)}
.aalert{border-radius:20px;padding:13px 16px;font-size:12.5px;line-height:1.6;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;animation:bubble .6s var(--spring)}
.aalert.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.35);color:#4ade80}
.aalert.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);color:#fbbf24}
[data-theme="light"] .aalert.ok{color:#15803d}
[data-theme="light"] .aalert.warn{color:#b45309}
.atabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.atabs::-webkit-scrollbar{display:none}
.atab{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;border:1px solid var(--gborder);background:var(--chipbg);color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;transition:all .4s var(--spring)}
.atab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(255,122,0,.4);transform:scale(1.04)}
.atab .nb{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center}

.trow{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:18px;background:var(--chipbg);border:1px solid var(--gborder);margin-bottom:8px;animation:bubble .5s var(--spring) backwards;animation-delay:calc(var(--i)*30ms)}
.trow .rk{font-family:'Bebas Neue',Impact,sans-serif;font-size:24px;color:var(--accent);width:30px;text-align:center;flex-shrink:0}
.trow .thumb{width:38px;aspect-ratio:2/3;border-radius:9px;overflow:hidden;flex-shrink:0;position:relative;background:var(--surface2)}

.modebar{display:flex;align-items:center;gap:8px;margin-bottom:14px}

.modebar .seg2 button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 12px rgba(255,122,0,.4)}
.pickrow{display:flex;gap:8px;margin-top:12px}
.pickrow select{flex:1;padding:11px 13px;border-radius:14px;background:var(--chipbg);border:1px solid var(--gborder);color:var(--text);font-size:14px;font-family:inherit;outline:none}
.reqcard{border-radius:20px;padding:14px;background:var(--chipbg);border:1px solid var(--gborder);margin-bottom:10px;animation:bubble .5s var(--spring) backwards;animation-delay:calc(var(--i)*35ms)}
.reqcard .rt{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reqcard .rm{font-size:11.5px;color:var(--muted);margin-top:4px}
.reqcard .rn{font-size:12px;margin-top:6px;color:var(--text);opacity:.85}
.lockwrap{max-width:400px;margin:6vh auto 0;border-radius:28px;padding:30px 24px;text-align:center;animation:pop .6s var(--spring)}
.lockwrap .li{width:76px;height:76px;border-radius:26px;margin:0 auto 16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 16px 40px rgba(255,122,0,.45);animation:wobble 3s ease-in-out infinite}
.lockwrap.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.switch{position:relative;width:50px;height:28px;border-radius:99px;background:var(--chipbg);border:1px solid var(--gborder);cursor:pointer;transition:background .3s;flex-shrink:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:all .35s var(--spring)}
.switch.on{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}

<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<div id="boot"><div class="boot-in">
  <div class="boot-logo"><i data-ic="play" data-s="40"></i></div>
  <div class="display text-5xl">KNL<span style="color:var(--accent)">Movies</span></div>
  <div class="mt-3 dots-load"><i></i><i></i><i></i></div>
  <p class="text-sm mt-4" style="color:var(--muted)" id="bootMsg">Library load ho rahi hai…</p>
</div></div>

<header class="nav fixed top-0 inset-x-0 z-50" style="padding-top:var(--sat)">
  <div class="max-w-[1500px] mx-auto px-4 md:px-8 h-16 flex items-center gap-3 md:gap-5">
    <a href="#" onclick="setView('home');return false" class="nav-item flex items-center gap-2 shrink-0">
      <span class="w-10 h-10 rounded-[14px] grid place-items-center text-white" style="background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 16px rgba(255,122,0,.45),inset 0 1px 1px rgba(255,255,255,.6)"><i data-ic="play" data-s="20"></i></span>
      <span class="display text-3xl leading-none hidden min-[430px]:inline">KNL<span style="color:var(--accent)">Movies</span></span>
    </a>
    <div class="hidden md:block flex-1"></div>
    <div id="sbSlot" class="h-11 flex-1 md:flex-none md:w-[300px] min-w-0 max-w-[340px]"></div>
    <button id="themeBtn" class="nav-item icon-btn glass shrink-0" aria-label="Toggle theme"></button>
    <div id="avatar" class="nav-item hidden sm:grid w-10 h-10 rounded-full place-items-center font-bold text-white shrink-0 overflow-hidden" style="background:linear-gradient(135deg,#444,var(--accent));box-shadow:inset 0 1px 1px rgba(255,255,255,.5);cursor:pointer" onclick="setView('profile')">K</div>
  </div>
</header>

<main class="pb-36">
  <section id="homeView">
    <div class="hero" id="hero"><div id="heroSlides"></div>
      <div class="absolute bottom-7 inset-x-0 z-10 flex justify-center items-center gap-2" id="heroDots"></div></div>
    <div class="max-w-[1500px] mx-auto px-4 md:px-8 -mt-6 relative z-10">
      <div id="annBox"></div>
      <div class="flex gap-2 overflow-x-auto no-scrollbar py-3 px-1" id="chipsHome"></div>
      <div id="rows"></div>
    </div>
  </section>

  <section id="searchView" class="hidden pt-24 max-w-[1100px] mx-auto px-4 md:px-8">
    <h1 class="display text-5xl md:text-6xl mb-4">Search</h1>
    <div class="sc-bar glass"><div class="sx-bar">
      <span data-ic="search" data-s="21" style="color:var(--accent)"></span>
      <input id="scInput" class="sx-input" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search titles, cast, genres…">
      <button class="sx-btn" data-act="clear" aria-label="Clear"><i data-ic="x" data-s="15"></i></button>
      <button class="sx-btn" data-act="mic" aria-label="Voice"><i data-ic="mic" data-s="18"></i></button>
      <button class="sx-btn" data-act="filter" aria-label="Filters"><i data-ic="sliders" data-s="18"></i><span class="fbadge"></span></button>
    </div></div>
    <div id="scMount" class="mt-5"></div>
  </section>

  <section id="browseView" class="hidden pt-24 max-w-[1500px] mx-auto px-4 md:px-8">
    <h1 id="browseTitle" class="display text-5xl md:text-6xl mb-1"></h1>
    <p id="browseSub" class="text-sm mb-5" style="color:var(--muted)"></p>
    <div class="flex gap-2 overflow-x-auto no-scrollbar py-2 px-1" id="chipsBrowse"></div>
    <div id="grid" class="grid-cards mt-3 stag"></div>
    <div id="empty" class="hidden text-center py-24"><div class="empty-s">
      <div class="em"><i data-ic="movies" data-s="40"></i></div>
      <p class="text-lg font-semibold" id="emptyTitle">Koi title nahi mila</p>
      <p class="text-sm" style="color:var(--muted)" id="emptyMsg">Filter badal kar dekhein.</p>
      <button class="btn-primary px-6 py-3 mt-4 text-sm" onclick="openRequest()">🎬 Movie Request Karein</button>
    </div></div>
  </section>

  <section id="profileView" class="hidden pt-24 max-w-[1100px] mx-auto px-4 md:px-8">
    <div id="profileBody"></div>
  </section>

  <section id="adminView" class="hidden pt-24 max-w-[1100px] mx-auto px-4 md:px-8">
    <div id="adminBody"></div>
  </section>

  <footer class="max-w-[1500px] mx-auto px-4 md:px-8 mt-10 pt-8 border-t">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <span class="display text-3xl">KNL<span style="color:var(--accent)">Movies</span></span>
      <div class="flex flex-wrap gap-5 text-sm" style="color:var(--muted)">
        <a href="#" onclick="setView('home');return false" class="hover:text-[var(--accent)]">Home</a>
        <a href="#" onclick="setView('movies');return false" class="hover:text-[var(--accent)]">Movies</a>
        <a href="#" onclick="setView('series');return false" class="hover:text-[var(--accent)]">Series</a>
        <a href="#" onclick="setView('profile');return false" class="hover:text-[var(--accent)]">Profile</a>
      </div>
    </div>
    <p class="text-xs mt-4" style="color:var(--muted)">© KNL Movies • Members only • Instant download</p>
  </footer>
</main>

<nav class="dock glass" id="dock">
  <button class="dk active" data-view="home" onclick="setView('home')"><i data-ic="home" data-s="23"></i><span class="dk-l">Home</span></button>
  <button class="dk" data-view="movies" onclick="setView('movies')"><i data-ic="movies" data-s="23"></i><span class="dk-l">Movies</span></button>
  <button class="dk" data-view="search" onclick="setView('search')"><i data-ic="search" data-s="23"></i><span class="dk-l">Search</span></button>
  <button class="dk" data-view="series" onclick="setView('series')"><i data-ic="series" data-s="23"></i><span class="dk-l">Series</span></button>
  <button class="dk" data-view="profile" onclick="setView('profile')"><i data-ic="user" data-s="23"></i><span class="dk-l">Profile</span><b id="likeCount" class="dk-badge">0</b></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sh glass" id="sh">
  <div class="sh-bar sx-bar">
    <span data-ic="search" data-s="19" style="color:var(--accent)"></span>
    <input id="shInput" class="sx-input" type="search" autocomplete="off" enterkeyhint="search" placeholder="Search">
    <div class="sh-ctl">
      <button class="sx-btn" data-act="clear"><i data-ic="x" data-s="14"></i></button>
      <button class="sx-btn" data-act="mic"><i data-ic="mic" data-s="17"></i></button>
      <button class="sx-btn" data-act="filter"><i data-ic="sliders" data-s="17"></i><span class="fbadge"></span></button>
      <button class="sx-btn" data-act="close"><i data-ic="chevUp" data-s="17"></i></button>
    </div>
  </div>
  <div class="sh-body"><div class="sh-inner"><div class="sh-scroll" id="shMount"></div></div></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="overlay" id="reqOverlay"><div class="modal req-modal" id="reqModal"></div></div>
<div class="toast glass" id="toast"></div>

/* ══ SEARCH ══ */
var S={q:'',type:'all',genres:[],rating:0,year:'any',lang:'any',sort:'rel',layout:'grid',filtersOpen:false,sugOpen:true,sel:-1,sugList:[],recent:JSON.parse(localStorage.getItem('knl_recent')||'[]')};
var TYPEW={movie:'movie',movies:'movie',film:'movie',films:'movie',series:'series',show:'series',shows:'series'};
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function words(s){return norm(s).split(/[^a-z0-9]+/).filter(Boolean);}
function lev(a,b){if(a===b)return 0;var m=a.length,n=b.length;if(!m)return n;if(!n)return m;
var prev=[],i,j;for(j=0;j<=n;j++)prev[j]=j;
for(i=1;i<=m;i++){var cur=[i];for(j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}
return prev[n];}
function buildIndex(){var vocab={},years={},langs={};
M.forEach(function(m){m.genres=m.genres||[];m.cast=m.cast||[];
m._t=norm(m.name);m._tw=words(m.name);
m._cast=m.cast.map(function(c){return {n:c,l:norm(c),w:words(c)};});
m._g=m.genres.map(norm);m._lang=norm(m.language);m._d=norm(m.description);
var v=m._tw.slice();m._cast.forEach(function(c){v=v.concat(c.w);});
m.genres.forEach(function(g){v=v.concat(words(g));});
v=v.concat(words(m.language),words(m.quality));
m._v=v.filter(function(x,i){return v.indexOf(x)===i;});
m._v.forEach(function(x){vocab[x]=1;});
if(m.year)years[m.year]=1;
(m.language||'').split(/[•,\/]/).forEach(function(x){x=x.trim();if(x)langs[x]=1;});});
VOCAB=Object.keys(vocab);
YEARS=Object.keys(years).map(Number).sort(function(a,b){return b-a;}).slice(0,6);
LANGS=Object.keys(langs).slice(0,6);
TREND=M.slice().sort(function(a,b){return (b.rating||0)-(a.rating||0);}).slice(0,4).map(function(m){return m.name;}).concat(GENRES.slice(1,5));}
function tokens(){return words(S.q);}
function hl(text){var h=esc(text),t=tokens().filter(function(x){return x.length>0;}).map(function(x){return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');});
if(!t.length)return h;
try{h=h.replace(new RegExp('('+t.join('|')+')','gi'),'<mark>$1</mark>');}catch(e){}
return h;}
function scoreMovie(m,toks){var total=0,why=[];
for(var k=0;k<toks.length;k++){var t=toks[k],s=0,w='';
if(m._t.indexOf(t)===0)s=100;else if(m._tw.some(function(x){return x.indexOf(t)===0;}))s=70;else if(m._t.indexOf(t)>-1)s=45;
if(s<100){var c=null;
for(var i=0;i<m._cast.length;i++){var cc=m._cast[i];if(cc.w.some(function(x){return x.indexOf(t)===0;})||cc.l.indexOf(t)>-1){c=cc;break;}}
if(c&&s<55){s=55;w='Cast: '+c.n;}
var gi=-1;for(var j=0;j<m._g.length;j++)if(m._g[j].indexOf(t)===0){gi=j;break;}
if(gi>-1&&s<40){s=40;w='Genre: '+m.genres[gi];}
if(TYPEW[t]&&TYPEW[t]===m.type&&s<25){s=25;w=m.type==='series'?'Series':'Movie';}
if(String(m.year)===t&&s<30){s=30;w='Year '+m.year;}
if(m._lang.indexOf(t)>-1&&s<12){s=12;w='Language: '+m.language;}
if(!s&&t.length>=3&&norm(m.quality).indexOf(t)>-1){s=20;w='Quality: '+m.quality;}
if(!s&&t.length>=4&&m._d.indexOf(t)>-1){s=15;w='Description match';}
if(!s&&t.length>=3){var thr=t.length>=6?2:1,best=9;
for(var q=0;q<m._v.length;q++){var v=m._v[q];best=Math.min(best,lev(t,v),lev(t,v.slice(0,t.length)));}
if(best<=thr){s=28-best*6;w='Similar match';}}}
if(!s)return null;total+=s;if(w)why.push(w);}
return {m:m,score:total+(m.rating||0),why:why[0]||''};}
function passFilters(m){
if(S.type!=='all'&&m.type!==S.type)return false;
if(S.genres.length&&!S.genres.some(function(g){return (m.genres||[]).indexOf(g)>-1;}))return false;
if(S.rating&&(m.rating||0)<S.rating)return false;
if(S.year!=='any'&&String(m.year)!==S.year)return false;
if(S.lang!=='any'&&(m.language||'').indexOf(S.lang)===-1)return false;
return true;}
function runSearch(){var toks=tokens();
var arr=M.filter(passFilters).map(function(m){return toks.length?scoreMovie(m,toks):{m:m,score:m.rating||0,why:''};}).filter(Boolean);
var cmp={rel:function(a,b){return b.score-a.score;},rating:function(a,b){return (b.m.rating||0)-(a.m.rating||0);},
nw:function(a,b){return (b.m.created||0)-(a.m.created||0);},az:function(a,b){return a.m.name.localeCompare(b.m.name);}};
return arr.sort(S.sort==='new'?cmp.nw:cmp[S.sort]).slice(0,80);}
function didYouMean(){var toks=tokens();if(!toks.length||!VOCAB.length)return null;var changed=false;
var fixed=toks.map(function(t){if(VOCAB.some(function(v){return v.indexOf(t)===0;}))return t;
var best=t,bd=99;VOCAB.forEach(function(v){var d=lev(t,v);if(d<bd){bd=d;best=v;}});
if(bd<=2&&t.length>2){changed=true;return best;}return t;});
return changed?fixed.join(' '):null;}
function buildSug(){var q=norm(S.q.trim());if(!q)return [];var out=[],seen={};
function push(text,kind,icon){var k=norm(text);if(seen[k]||k===q)return;seen[k]=1;out.push({text:text,kind:kind,icon:icon});}
M.filter(function(m){return m._t.indexOf(q)>-1||m._tw.some(function(w){return w.indexOf(q)===0;});})
.sort(function(a,b){return ((b._t.indexOf(q)===0)-(a._t.indexOf(q)===0))||(b.rating||0)-(a.rating||0);})
.slice(0,4).forEach(function(m){push(m.name,'Title','movies');});
var n=0;M.forEach(function(m){m._cast.forEach(function(c){if(n<2&&c.l.indexOf(q)>-1&&!seen[c.l]){push(c.n,'Cast','user');n++;}});});
GENRES.filter(function(g){return g!=='All'&&norm(g).indexOf(q)===0;}).forEach(function(g){push(g,'Genre','sparkle');});
return out.slice(0,6);}
function filterCount(){return (S.type!=='all'?1:0)+S.genres.length+(S.rating>0?1:0)+(S.year!=='any'?1:0)+(S.lang!=='any'?1:0);}
function filtersHTML(){function ch(f,v,label,on){return '<button class="chip sm '+(on?'active':'')+'" data-act="f" data-f="'+f+'" data-v="'+esc(v)+'">'+label+'</button>';}
var h='<div class="fl"><b>Sort by</b><div>'+[['rel','Relevance'],['rating','Top rated'],['new','Newest'],['az','A – Z']].map(function(p){return ch('sort',p[0],p[1],S.sort===p[0]);}).join('')+'</div></div>'+
'<div class="fl"><b>Type</b><div>'+[['all','All'],['movie','Movies'],['series','Series']].map(function(p){return ch('type',p[0],p[1],S.type===p[0]);}).join('')+'</div></div>';
if(M.some(function(m){return m.rating;}))h+='<div class="fl"><b>Rating</b><div>'+[[0,'Any'],[7,'7+ ★'],[8,'8+ ★'],[8.5,'8.5+ ★']].map(function(p){return ch('rating',p[0],p[1],S.rating===p[0]);}).join('')+'</div></div>';
if(YEARS.length)h+='<div class="fl"><b>Year</b><div>'+['any'].concat(YEARS).map(function(v){return ch('year',v,v==='any'?'Any':v,S.year===String(v));}).join('')+'</div></div>';
if(LANGS.length)h+='<div class="fl"><b>Language</b><div>'+['any'].concat(LANGS).map(function(v){return ch('lang',v,v==='any'?'Any':esc(v),S.lang===v);}).join('')+'</div></div>';
if(GENRES.length>1)h+='<div class="fl"><b>Genres</b><div>'+GENRES.slice(1).map(function(g){return ch('genre',g,esc(g),S.genres.indexOf(g)>-1);}).join('')+'</div></div>';
h+='<div class="fl"><button class="lnk" style="margin-left:0" data-act="resetf">Reset all filters</button></div>';return h;}

function voiceSearch(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){toast('Voice search supported nahi');return;}
try{var r=new SR();r.lang='en-IN';r.interimResults=true;
$$('[data-act="mic"]').forEach(function(b){b.classList.add('listening');});
toast('Listening…');
r.onresult=function(e){var txt='';for(var i=0;i<e.results.length;i++)txt+=e.results[i][0].transcript;setQuery(txt,e.results[e.results.length-1].isFinal);};
r.onerror=function(){toast('Sun nahi paye, retry');};
r.onend=function(){$$('[data-act="mic"]').forEach(function(b){b.classList.remove('listening');});};
r.start();}catch(e){toast('Voice unavailable');}}
document.addEventListener('click',function(e){

var a=b.getAttribute('data-act'),v=b.getAttribute('data-v');
function focusIn(){var i=shOpen?E('shInput'):E('scInput');if(i)i.focus({preventScroll:true});}
switch(a){
case 'clear':setQuery('',false);S.sugOpen=true;renderSearchUI();focusIn();break;
case 'mic':voiceSearch();break;
case 'filter':S.filtersOpen=!S.filtersOpen;hap('select');renderSearchUI();break;
case 'close':closeSearch();break;
case 'recent':setQuery(v,true);break;
case 'dym':setQuery(v,true);break;
case 'rmRecent':S.recent.splice(+b.getAttribute('data-i'),1);localStorage.setItem('knl_recent',JSON.stringify(S.recent));clearIdleKey();renderSearchUI();break;
case 'clearRecent':S.recent=[];localStorage.removeItem('knl_recent');clearIdleKey();renderSearchUI();break;
case 'genre':S.genres=[v];S.sugOpen=false;hap('select');renderSearchUI();break;
case 'sug':applySug(+b.getAttribute('data-i'));break;
case 'layout':S.layout=v;hap('select');renderSearchUI();break;
case 'resetf':S.type='all';S.genres=[];S.rating=0;S.year='any';S.lang='any';renderSearchUI();break;
case 'rmf':{var k=b.getAttribute('data-k');
if(k==='type')S.type='all';else if(k==='genre')S.genres=S.genres.filter(function(g){return g!==v;});
else if(k==='rating')S.rating=0;else if(k==='year')S.year='any';else if(k==='lang')S.lang='any';
renderSearchUI();break;}
case 'f':{var f=b.getAttribute('data-f');hap('select');
if(f==='genre')S.genres=S.genres.indexOf(v)>-1?S.genres.filter(function(g){return g!==v;}):S.genres.concat([v]);
else if(f==='rating')S.rating=+v;else S[f]=v;renderSearchUI();break;}
case 'atab':A.tab=v;hap('select');paintAdmin();break;
case 'atype':A.type=v;hap('select');paintAdminForm();break;
case 'more':A.moreOpen=!A.moreOpen;hap('select');paintAdminForm();break;
case 'asave':adminSave();break;

case 'adel':adminDelete(v);break;
case 'apost':adminRepost(v);break;
case 'arefresh':hap('light');loadAdminData(true);break;
case '/logout':ATOKEN='';sessionStorage.removeItem('knl_atk');renderAdminLogin();break;
case 'heromode':curSet('hero_mode',v);break;
case 'topmode':curSet('top_mode',v);break;
case 'herorm':curRemove('hero_manual',+v);break;
case 'toprm':curRemove('top_manual',+v);break;
case 'heromv':curMove('hero_manual',+b.getAttribute('data-i'),+v);break;
case 'topmv':curMove('top_manual',+b.getAttribute('data-i'),+v);break;
case 'heroadd':curAdd('hero_manual','heroPick');break;
case 'topadd':curAdd('top_manual','topPick');break;
case 'reqact':reqAction(v,b.getAttribute('data-id'));break;
case 'reqadd':reqToAdd(v);break;
case 'annsave':saveAnn();break;
case 'reqtoggle':toggleReqOpen();break;
}});
function bindSearchInputs(){$$('.sx-input').forEach(function(inp){
inp.addEventListener('input',function(e){S.sugOpen=true;setQuery(e.target.value,false);});
inp.addEventListener('focus',function(){if(S.q&&!S.sugOpen){S.sugOpen=true;renderSearchUI();}});
inp.addEventListener('keydown',function(e){

if(window.matchMedia&&matchMedia('(pointer:coarse)').matches)inp.blur();}});});}

var typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
if((e.key==='/'&&!typing)||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')){e.preventDefault();openSearch();}});
window.addEventListener('error',function(ev){var b=E('boot');
if(b&&!b.classList.contains('gone'))bootFail('Load error: '+(ev.message||'unknown'));});
var bootDone=false;
setTimeout(function(){if(!bootDone)bootFail('Server slow hai. Retry karein.');},15000);
loadCatalog(false).then(function(){bootDone=true;}).catch(function(e){bootDone=true;bootFail(e.message||'Connect nahi ho paya');});
if(INIT){api('/api/session').then(function(s){
IS_ADMIN=!!s.is_admin;USER=s.user||null;
if(IS_ADMIN){var dk=document.createElement('button');
dk.className='dk';dk.setAttribute('data-view','admin');
dk.innerHTML=ico('sliders',23)+'<span class="dk-l">Admin</span>';
dk.onclick=function(){setView('admin');};E('dock').appendChild(dk);}
if(USER){var av=E('avatar');
if(USER.photo)av.innerHTML='<img src="'+esc(USER.photo)+'" class="w-full h-full object-cover" alt="">';
else av.textContent=(USER.name||'K').charAt(0).toUpperCase();}
return refreshSync();}).catch(function(){IS_ADMIN=false;});}
</script>
</body>
</html>
