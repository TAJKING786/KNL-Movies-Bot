<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Movies</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0e1116; --bg2:#151a21; --card:#1a2029; --line:#242c37;
  --txt:#eef2f7; --dim:#8b97a8; --accent:#2f86eb; --ok:#22c55e;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  overscroll-behavior:none; -webkit-font-smoothing:antialiased;
}
.wrap{padding:0 14px calc(24px + env(safe-area-inset-bottom))}

/* Header */
header{
  position:sticky; top:0; z-index:20; background:rgba(14,17,22,.92);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
}
.hrow{display:flex;align-items:center;gap:10px}
.logo{
  width:34px;height:34px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),#7c3aed);
  display:flex;align-items:center;justify-content:center;font-size:17px;
}
.htitle{font-size:16px;font-weight:700;letter-spacing:.2px;line-height:1.2}
.hsub{font-size:11px;color:var(--dim);margin-top:2px}
.refresh{
  margin-left:auto;width:34px;height:34px;border-radius:10px;flex:0 0 auto;
  background:var(--card);border:1px solid var(--line);color:var(--dim);
  font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.refresh:active{transform:scale(.92)}
.refresh.spin{animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Search */
.search{position:relative;margin-top:12px}
.search input{
  width:100%;padding:12px 14px 12px 38px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);color:var(--txt);
  font-size:14px;outline:none;
}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:var(--accent)}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--card);border:1px solid var(--line);color:var(--dim);cursor:pointer;
  transition:.15s;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:active{transform:scale(.95)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;transition:transform .12s;
}
.card:active{transform:scale(.97)}
.poster{position:relative;width:100%;aspect-ratio:2/3;background:var(--bg2);overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.ph{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:34px;background:linear-gradient(150deg,#1f2937,#111827);
}
.qbadge{
  position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:7px;
  background:rgba(0,0,0,.72);backdrop-filter:blur(6px);
  font-size:10px;font-weight:700;letter-spacing:.3px;
}
.cbody{padding:10px 11px 12px}
.cname{font-size:13px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.csize{font-size:11px;color:var(--dim);margin-top:5px}

/* Skeleton */
.sk{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.sk .a{width:100%;aspect-ratio:2/3;background:linear-gradient(100deg,#1a2029 30%,#232b36 50%,#1a2029 70%);
  background-size:220% 100%;animation:sh 1.3s infinite}
.sk .b{height:12px;margin:12px 11px;border-radius:6px;background:#232b36}
.sk .c{height:9px;margin:0 11px 14px;width:50%;border-radius:6px;background:#1f2731}
@keyframes sh{0%{background-position:120% 0}100%{background-position:-120% 0}}

/* States */
.state{text-align:center;padding:64px 24px;color:var(--dim)}
.state .em{font-size:46px;margin-bottom:12px}
.state h3{color:var(--txt);font-size:16px;margin:0 0 6px}
.state p{font-size:13px;line-height:1.6;margin:0}
.state button{
  margin-top:18px;padding:11px 22px;border-radius:11px;border:none;
  background:var(--accent);color:#fff;font-size:13px;font-weight:700;cursor:pointer;
}

/* Detail */
.detail{
  position:fixed;inset:0;z-index:50;background:var(--bg);
  transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.detail.open{transform:translateY(0)}
.backdrop{position:absolute;top:0;left:0;right:0;height:340px;overflow:hidden}
.backdrop img{width:100%;height:100%;object-fit:cover;filter:blur(26px) brightness(.42);transform:scale(1.2)}
.backdrop::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,17,22,.45),var(--bg))}
.dclose{
  position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:3;
  width:36px;height:36px;border-radius:11px;background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);
  color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.dcontent{position:relative;z-index:2;padding:calc(60px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
.dposter{
  width:158px;aspect-ratio:2/3;margin:0 auto;border-radius:16px;overflow:hidden;
  background:var(--bg2);box-shadow:0 18px 44px rgba(0,0,0,.6);position:relative;
}
.dposter img{width:100%;height:100%;object-fit:cover;display:block}
.dtitle{text-align:center;font-size:20px;font-weight:700;line-height:1.3;margin:18px 0 0}
.dmeta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.tag{padding:6px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--dim)}
.dbox{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}
.dbox h4{margin:0 0 10px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
.step{display:flex;gap:11px;align-items:flex-start;font-size:13px;line-height:1.55;color:#c6d0dc}
.step + .step{margin-top:10px}
.num{
  flex:0 0 auto;width:21px;height:21px;border-radius:7px;background:var(--bg2);
  border:1px solid var(--line);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.cta{
  width:100%;margin-top:20px;padding:16px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--accent),#1d6fd0);color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 10px 26px rgba(47,134,235,.28);
}
.cta:active{transform:scale(.98)}
.note{text-align:center;font-size:11px;color:var(--dim);margin-top:12px;line-height:1.6}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="logo">🎬</div>
    <div>
      <div class="htitle" id="brand">Movies</div>
      <div class="hsub" id="count">Loading…</div>
    </div>
    <div class="refresh" id="refresh">⟳</div>
  </div>
  <div class="search">
    <span class="ico">🔍</span>
    <input id="q" type="search" placeholder="Movie search karein…" autocomplete="off">
  </div>
</header>

<div class="chips" id="chips"></div>

<div class="wrap">
  <div class="grid" id="grid"></div>
  <div class="state hidden" id="state"></div>
</div>

<div class="detail" id="detail">
  <div class="backdrop" id="backdrop"></div>
  <div class="dclose" id="dclose">✕</div>
  <div class="dcontent" id="dcontent"></div>
</div>

<script>
var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
var S = { movies:[], brand:'Movies', bot:'', q:'', filter:'all', current:null };

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function haptic(kind){
  try{
    if(!tg || !tg.HapticFeedback) return;
    if(kind === 'select') tg.HapticFeedback.selectionChanged();
    else tg.HapticFeedback.impactOccurred(kind || 'light');
  }catch(e){}
}
function el(id){ return document.getElementById(id); }

/* ── Telegram init ── */
(function initTelegram(){
  if(!tg) return;
  try{ tg.ready(); tg.expand(); }catch(e){}
  try{ tg.setHeaderColor('#0e1116'); tg.setBackgroundColor('#0e1116'); }catch(e){}
  try{ if(tg.disableVerticalSwipes) tg.disableVerticalSwipes(); }catch(e){}
  try{
    var a = tg.themeParams && tg.themeParams.button_color;
    if(a) document.documentElement.style.setProperty('--accent', a);
  }catch(e){}
  try{ tg.BackButton.onClick(closeDetail); }catch(e){}
})();

/* ── Data load ── */
function skeleton(){
  el('state').classList.add('hidden');
  var h = '';
  for(var i=0;i<6;i++) h += '<div class="sk"><div class="a"></div><div class="b"></div><div class="c"></div></div>';
  el('grid').innerHTML = h;
}

function load(){
  skeleton();
  el('refresh').classList.add('spin');
  fetch('/api/movies', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d){
      S.movies = d.movies || [];
      S.brand  = d.brand  || 'Movies';
      S.bot    = d.bot    || '';
      el('brand').textContent = S.brand.replace(/^[^\w]+/, '').trim() || 'Movies';
      buildChips();
      render();
    })
    .catch(function(e){ showError(e.message); })
    .then(function(){ el('refresh').classList.remove('spin'); });
}

function showError(msg){
  el('grid').innerHTML = '';
  var s = el('state');
  s.classList.remove('hidden');
  s.innerHTML = '<div class="em">📡</div><h3>Load nahi hua</h3>' +
    '<p>Server se data nahi mila.<br><span style="opacity:.6">' + esc(msg) + '</span></p>' +
    '<button onclick="load()">Dobara try karein</button>';
  el('count').textContent = 'Connection error';
}

/* ── Filters ── */
function buildChips(){
  var seen = {}, list = [];
  S.movies.forEach(function(m){
    var q = (m.quality || '').trim();
    if(q && q !== '-' && !seen[q.toLowerCase()]){ seen[q.toLowerCase()] = 1; list.push(q); }
  });
  var h = '<div class="chip' + (S.filter==='all'?' on':'') + '" data-f="all">All</div>';
  list.forEach(function(q){
    h += '<div class="chip' + (S.filter===q?' on':'') + '" data-f="' + esc(q) + '">' + esc(q) + '</div>';
  });
  el('chips').innerHTML = h;
  Array.prototype.forEach.call(el('chips').children, function(c){
    c.onclick = function(){
      S.filter = c.getAttribute('data-f');
      haptic('select');
      buildChips();
      render();
    };
  });
}

/* ── Grid render ── */
function visible(){
  var q = S.q.toLowerCase().trim();
  return S.movies.filter(function(m){
    if(S.filter !== 'all' && (m.quality||'') !== S.filter) return false;
    if(q && (m.name||'').toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

function posterHTML(m, big){
  var inner = '<div class="ph">🎬</div>';
  if(m.poster){
    inner += '<img src="' + esc(m.poster) + '" alt="" loading="lazy" ' +
             'onerror="this.style.display=\'none\'">';
  }
  return inner;
}

function render(){
  var list = visible();
  el('count').textContent = S.movies.length + ' titles' + (list.length !== S.movies.length ? ' · ' + list.length + ' shown' : '');

  if(!list.length){
    el('grid').innerHTML = '';
    var s = el('state');
    s.classList.remove('hidden');
    if(!S.movies.length){
      s.innerHTML = '<div class="em">📭</div><h3>Library khali hai</h3>' +
        '<p>Abhi koi title add nahi hua.<br>Admin jald hi movies add karega.</p>';
    }else{
      s.innerHTML = '<div class="em">🔍</div><h3>Kuch nahi mila</h3>' +
        '<p>Search ya filter badal kar dekhein.</p>' +
        '<button onclick="clearFilters()">Filter clear karein</button>';
    }
    return;
  }

  el('state').classList.add('hidden');
  var h = '';
  list.forEach(function(m){
    h += '<div class="card" data-id="' + esc(m.id) + '">' +
           '<div class="poster">' + posterHTML(m) +
             (m.quality && m.quality !== '-' ? '<div class="qbadge">' + esc(m.quality) + '</div>' : '') +
           '</div>' +
           '<div class="cbody">' +
             '<div class="cname">' + esc(m.name) + '</div>' +
             '<div class="csize">📦 ' + esc(m.size) + '</div>' +
           '</div>' +
         '</div>';
  });
  el('grid').innerHTML = h;
  Array.prototype.forEach.call(el('grid').children, function(c){
    c.onclick = function(){ openDetail(c.getAttribute('data-id')); };
  });
}

function clearFilters(){
  S.q = ''; S.filter = 'all';
  el('q').value = '';
  buildChips(); render();
}

/* ── Detail ── */
function openDetail(id){
  var m = null;
  for(var i=0;i<S.movies.length;i++){ if(S.movies[i].id === id){ m = S.movies[i]; break; } }
  if(!m) return;
  S.current = m;
  haptic('light');

  el('backdrop').innerHTML = m.poster
    ? '<img src="' + esc(m.poster) + '" alt="" onerror="this.style.display=\'none\'">'
    : '';

  el('dcontent').innerHTML =
    '<div class="dposter">' + posterHTML(m, true) + '</div>' +
    '<div class="dtitle">' + esc(m.name) + '</div>' +
    '<div class="dmeta">' +
      '<div class="tag">📦 ' + esc(m.size) + '</div>' +
      '<div class="tag">🎞 ' + esc(m.quality) + '</div>' +
    '</div>' +
    '<div class="dbox">' +
      '<h4>Download process</h4>' +
      '<div class="step"><div class="num">1</div><div>Verification link kholen aur short process complete karein.</div></div>' +
      '<div class="step"><div class="num">2</div><div>Wapas aakar download link unlock karein.</div></div>' +
    '</div>' +
    '<button class="cta" id="cta">⬇️ Get Download Link</button>' +
    '<div class="note">Members only · Verification ke baad link unlock hoga</div>';

  el('cta').onclick = function(){ goBot(m); };
  el('detail').classList.add('open');
  document.body.style.overflow = 'hidden';
  try{ if(tg) tg.BackButton.show(); }catch(e){}
}

function closeDetail(){
  el('detail').classList.remove('open');
  document.body.style.overflow = '';
  S.current = null;
  try{ if(tg) tg.BackButton.hide(); }catch(e){}
}

function goBot(m){
  haptic('medium');
  if(!S.bot){
    if(tg) tg.showAlert('Bot username configure nahi hai. Admin ko batayein.');
    else alert('Bot username configure nahi hai.');
    return;
  }
  var url = 'https://t.me/' + S.bot + '?start=movie_' + encodeURIComponent(m.id);
  if(tg && tg.openTelegramLink) tg.openTelegramLink(url);
  else window.location.href = url;
}

/* ── Events ── */
el('dclose').onclick = function(){ haptic('light'); closeDetail(); };
el('refresh').onclick = function(){ haptic('light'); load(); };
var timer = null;
el('q').addEventListener('input', function(e){
  S.q = e.target.value;
  clearTimeout(timer);
  timer = setTimeout(render, 140);
});

load();
</script>
</body>
</html>
